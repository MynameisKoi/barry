<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BARRY // 3D Holographic VR Cockpit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050814;
            color: #d9e6f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #desktop-ui {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
            pointer-events: none;
        }
        .hud-badge {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
        }
        #switch-flatscreen {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        #switch-flatscreen:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00f0ff;
        }
        #command-status {
            position: absolute;
            top: 64px;
            left: 20px;
            z-index: 10;
            max-width: min(560px, calc(100vw - 40px));
            padding: 8px 12px;
            color: #fff;
            background: rgba(10, 16, 28, 0.92);
            border: 1px solid rgba(0, 240, 255, 0.45);
            border-radius: 6px;
            font: 700 0.8rem monospace;
            pointer-events: none;
        }
        #keyboard-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            background: rgba(10, 16, 26, 0.8);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }
    </style>
    <!-- Three.js + WebXR VRButton (Self-Hosted for Offline/Hotspot Reliability) -->
    <script src="/static/js/three.min.js"></script>
    <script src="/static/js/VRButton.js"></script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div id="desktop-ui">
        <div class="hud-badge">BARRY // VR LOCAL PREVIEW · NO API</div>
        <a id="switch-flatscreen" href="/cockpit">← 2D Flatscreen Mode</a>
    </div>
    <div id="command-status" role="status" aria-live="polite">LOCAL PREVIEW · Commands stay in this browser</div>
    <div id="keyboard-hint">
        🎮 <b>LOCAL PREVIEW:</b> VR laser + trigger on virtual joystick · WASD / Arrows on desktop · Space for E-Stop · No robot commands sent
    </div>

    <script>
        // --- State Management ---
        const state = {
            robotConnected: false,
            robotMode: "preview",
            battery: 0,
            roll: null,
            pitch: null,
            yaw: 0.0,
            rttMs: null,
            fps: 20,
            frameAgeMs: 45,
            intensity: "MEDIUM",
            speed: 0.6,
            lastCommand: "stop",
            commandStatus: "LOCAL PREVIEW",
            commandMessage: "Commands stay in this browser; no robot API is called",
            forward: 0.0,
            strafe: 0.0,
            turn: 0.0,
            eStopActive: false
        };
        const virtualJoystickAxes = { forward: 0, turn: 0 };

        function updateCommandStatus(status, message = "") {
            state.commandStatus = String(status || "UNKNOWN").toUpperCase();
            state.commandMessage = String(message || "");
            const statusElement = document.getElementById("command-status");
            if (statusElement) statusElement.textContent = [state.commandStatus, state.commandMessage].filter(Boolean).join(" · ");
            if (typeof drawLeftPanel === "function") drawLeftPanel();
        }

        function recordPreviewCommand(label, message = "Preview only · no robot command sent") {
            updateCommandStatus("LOCAL PREVIEW", `${label} · ${message}`);
        }

        // --- Three.js Setup ---
        const canvas = document.getElementById("webgl-canvas");
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050814);
        scene.fog = new THREE.FogExp2(0x050814, 0.015);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.4, 0); // Eye level standing inside cockpit

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.xr.enabled = true;
        renderer.xr.setReferenceSpaceType('local-floor');

        // Add WebXR button to enter immersive VR on Quest 3S
        const vrButton = VRButton.createButton(renderer);
        vrButton.style.zIndex = "100";
        vrButton.style.bottom = "20px";
        vrButton.style.right = "20px";
        document.body.appendChild(vrButton);

        // Ambient & Directional Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xa5b4fc, 0.6);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        // --- Environment: Starfield ---
        const starsCount = 2500;
        const starGeo = new THREE.BufferGeometry();
        const starCoords = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starCoords[i] = (Math.random() - 0.5) * 400;
            starCoords[i + 1] = Math.random() * 200; // Sky dome
            starCoords[i + 2] = (Math.random() - 0.5) * 400;
        }
        starGeo.setAttribute("position", new THREE.BufferAttribute(starCoords, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.85 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // --- Environment: Stylized Purple Saturn Planet with Rings ---
        const planetGroup = new THREE.Group();
        planetGroup.position.set(22, 14, -45); // Upper right sky as in teammate screenshot
        const planetGeo = new THREE.SphereGeometry(6, 32, 32);
        const planetMat = new THREE.MeshLambertMaterial({
            color: 0x6d28d9, // Vibrant purple
            emissive: 0x3b0764,
            emissiveIntensity: 0.4
        });
        const planetMesh = new THREE.Mesh(planetGeo, planetMat);
        planetGroup.add(planetMesh);

        // Saturn Rings
        const ringGeo = new THREE.RingGeometry(7.8, 12.5, 64);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0xc4b5fd,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.75
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2.5;
        ringMesh.rotation.y = Math.PI / 6;
        planetGroup.add(ringMesh);
        scene.add(planetGroup);

        // --- Environment: Retro Cyan Perspective Grid Floor ---
        const gridHelper = new THREE.GridHelper(160, 80, 0x00f0ff, 0x1e3a5f);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // Subtle dark plane under grid to block stars beneath floor
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x050814 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.position.y = -0.02;
        scene.add(floorMesh);
        // Holographic Cockpit Canopy Ribs (Framing the pilot space)
        const ribMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.28 });
        [-1, 1].forEach(side => {
            const curve = new THREE.EllipseCurve(side * 1.6, 1.4, 1.3, 1.5, 0, Math.PI, false, 0);
            const pts = curve.getPoints(40);
            const ribGeo = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p.x, p.y, -2.15)));
            scene.add(new THREE.Line(ribGeo, ribMat));
        });

        // --- Interactive Holographic Panels ---
        function createHoloPanel(w, h, canvasWidth, canvasHeight, pos, rotY = 0, rotX = 0) {
            const offscreenCanvas = document.createElement("canvas");
            offscreenCanvas.width = canvasWidth;
            offscreenCanvas.height = canvasHeight;
            const ctx = offscreenCanvas.getContext("2d");

            const texture = new THREE.CanvasTexture(offscreenCanvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            const geo = new THREE.PlaneGeometry(w, h);
            const mat = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            mesh.rotation.y = rotY;
            if (rotX !== 0) mesh.rotation.x = rotX;
            scene.add(mesh);

            return { canvas: offscreenCanvas, ctx, texture, mesh };
        }

        // 1. LEFT PANEL: STATUS, TELEMETRY & COMMAND SENT (Spread out to left)
        const leftPanel = createHoloPanel(
            1.35, 1.6, 540, 640,
            new THREE.Vector3(-1.85, 1.40, -1.95),
            Math.PI * 0.23, 0 // Angled ~41.4° inward
        );

        function drawLeftPanel() {
            const { ctx, canvas: c, texture } = leftPanel;
            ctx.clearRect(0, 0, c.width, c.height);

            // Translucent rounded panel with glowing border
            ctx.fillStyle = "rgba(10, 16, 28, 0.88)";
            ctx.strokeStyle = "rgba(220, 230, 255, 0.9)";
            ctx.lineWidth = 3;
            roundRect(ctx, 4, 4, c.width - 8, c.height - 8, 16, true, true);

            // STATUS Header
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px -apple-system, monospace";
            ctx.fillText("STATUS", 32, 48);

            // Status Metrics Grid
            ctx.fillStyle = "#94a3b8";
            ctx.font = "18px -apple-system, monospace";
            ctx.fillText("Robot", 32, 90);
            ctx.fillText("Control", 280, 90);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText(state.robotConnected ? "ONLINE" : "--", 32, 118);
            ctx.fillText(state.robotMode.toUpperCase(), 280, 118);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "18px -apple-system, monospace";
            ctx.fillText("Camera", 32, 160);
            ctx.fillText("Backend RTT", 280, 160);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText(state.robotConnected ? "READY" : "--", 32, 188);
            ctx.fillText(state.rttMs === null ? "-- ms" : `${state.rttMs} ms`, 280, 188);
            // Battery
            ctx.fillStyle = "#94a3b8";
            ctx.font = "18px -apple-system, monospace";
            ctx.fillText("Battery", 32, 230);
            ctx.fillStyle = state.battery > 20 ? "#00ff88" : "#ff2a4b";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText(state.battery > 0 ? `${Math.round(state.battery)} %` : "-- %", 460, 230);

            // Battery bar
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            roundRect(ctx, 32, 246, c.width - 64, 10, 5, true, false);
            if (state.battery > 0) {
                ctx.fillStyle = state.battery > 20 ? "#00ff88" : "#ff2a4b";
                roundRect(ctx, 32, 246, Math.max(10, ((c.width - 64) * state.battery) / 100), 10, 5, true, false);
            }

            // Divider Line
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(32, 290);
            ctx.lineTo(c.width - 32, 290);
            ctx.stroke();

            // Virtual VR joystick. The controller laser moves the knob while its
            // trigger is held; a neutral stick sends an explicit stop.
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText("VR JOYSTICK", 32, 335);
            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px -apple-system, monospace";
            ctx.fillText("AIM LASER · HOLD TRIGGER · RELEASE TO STOP", 32, 360);

            const stickX = 170;
            const stickY = 480;
            const stickRadius = 92;
            ctx.fillStyle = "rgba(0, 240, 255, 0.08)";
            ctx.strokeStyle = "rgba(0, 240, 255, 0.75)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(stickX, stickY, stickRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(stickX - stickRadius, stickY);
            ctx.lineTo(stickX + stickRadius, stickY);
            ctx.moveTo(stickX, stickY - stickRadius);
            ctx.lineTo(stickX, stickY + stickRadius);
            ctx.stroke();

            const knobX = stickX - virtualJoystickAxes.turn * stickRadius;
            const knobY = stickY - virtualJoystickAxes.forward * stickRadius;
            ctx.fillStyle = "rgba(0, 240, 255, 0.75)";
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(knobX, knobY, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#cbd5e1";
            ctx.font = "bold 13px -apple-system, monospace";
            ctx.textAlign = "center";
            ctx.fillText("FORWARD", stickX, stickY - stickRadius - 12);
            ctx.fillText("BACK", stickX, stickY + stickRadius + 21);
            ctx.fillText("TURN LEFT", stickX - stickRadius - 35, stickY + 5);
            ctx.fillText("TURN RIGHT", stickX + stickRadius + 38, stickY + 5);
            ctx.textAlign = "left";

            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px -apple-system, monospace";
            ctx.fillText(`FORWARD  ${state.forward.toFixed(2)}`, 320, 430);
            ctx.fillText(`STRAFE   ${state.strafe.toFixed(2)}`, 320, 462);
            ctx.fillText(`TURN     ${state.turn.toFixed(2)}`, 320, 494);

            ctx.fillStyle = state.commandStatus === "LOCAL PREVIEW" ? "#00f0ff" : "#fbbf24";
            ctx.font = "bold 16px -apple-system, monospace";
            ctx.fillText(`RESULT · ${state.commandStatus}`, 320, 542);
            ctx.fillStyle = "#cbd5e1";
            ctx.font = "14px -apple-system, monospace";
            ctx.fillText(state.commandMessage, 320, 566, 190);

            // Footer info dot
            ctx.fillStyle = "#6366f1"; // Purple-blue indicator
            ctx.beginPath();
            ctx.arc(42, 620, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#94a3b8";
            ctx.font = "15px -apple-system, monospace";
            ctx.fillText("Accepted by API · not proof of movement", 58, 625);

            texture.needsUpdate = true;
        }

        // 2. CENTER PANEL: LIVE ROBOT CAMERA (Forward Optics Display)
        const centerPanel = createHoloPanel(
            2.1, 1.4, 840, 560,
            new THREE.Vector3(0, 1.48, -2.4),
            0, 0 // Center front
        );

        function drawCenterPanel() {
            const { ctx, canvas: c, texture } = centerPanel;
            ctx.clearRect(0, 0, c.width, c.height);

            // Outer Frame with glowing white border
            ctx.fillStyle = "rgba(10, 15, 24, 0.92)";
            ctx.strokeStyle = "rgba(230, 238, 255, 0.95)";
            ctx.lineWidth = 3.5;
            roundRect(ctx, 4, 4, c.width - 8, c.height - 8, 16, true, true);

            // Top Header: BARRY MODE · MANUAL
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText("BARRY", 28, 42);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "16px -apple-system, monospace";
            ctx.fillText("MODE · MANUAL · more modes later", 120, 42);

            ctx.fillText("·· --", c.width - 80, 42);

            // Inner Video Display Area
            const vidX = 24;
            const vidY = 62;
            const vidW = c.width - 48;
            const vidH = c.height - 86;

            ctx.fillStyle = "#020408";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 1.5;
            roundRect(ctx, vidX, vidY, vidW, vidH, 8, true, true);

            // Local preview has no camera or telemetry connection.
            const hasLiveFrame = false;

            // Video Top HUD Overlay: local render rate and preview attitude
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px monospace";
            ctx.fillText(`RENDER ${state.fps} FPS`, vidX + 16, vidY + 28);
            ctx.fillText(`LOCAL PREVIEW`, vidX + 170, vidY + 28);

            const roll = state.roll === null ? "--" : state.roll.toFixed(1);
            const pitch = state.pitch === null ? "--" : state.pitch.toFixed(1);
            const attitudeText = `ROLL ${roll}° · PITCH ${pitch}°`;
            ctx.fillText(attitudeText, vidX + vidW - 240, vidY + 28);

            // Center Crosshair Reticle
            const cx = vidX + vidW / 2;
            const cy = vidY + vidH / 2 - 10;
            ctx.strokeStyle = "rgba(0, 240, 255, 0.6)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy, 18, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 3, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 240, 255, 0.9)";
            ctx.fill();

            if (!hasLiveFrame) {
                ctx.fillStyle = "#94a3b8";
                ctx.font = "bold 15px monospace";
                ctx.textAlign = "center";
                ctx.fillText("[ CAMERA DISABLED IN PREVIEW ]", cx, cy + 54);

                ctx.font = "13px -apple-system, monospace";
                ctx.fillText("No camera or robot API connection", cx, cy + 78);
                ctx.textAlign = "left";
            }

            texture.needsUpdate = true;
        }
        // 3. BOTTOM PANEL: INTENSITY & EMERGENCY STOP FLIGHT DOCK (Angled forward desk)
        const bottomPanel = createHoloPanel(
            1.6, 0.40, 640, 160,
            new THREE.Vector3(0, 0.58, -1.75),
            0, -Math.PI / 6.5 // Tilted ~27.7° upwards towards pilot
        );

        function drawBottomPanel() {
            const { ctx, canvas: c, texture } = bottomPanel;
            ctx.clearRect(0, 0, c.width, c.height);

            // Translucent rounded bar with glowing border
            ctx.fillStyle = "rgba(10, 16, 28, 0.92)";
            ctx.strokeStyle = "rgba(220, 230, 255, 0.95)";
            ctx.lineWidth = 3;
            roundRect(ctx, 4, 4, c.width - 8, c.height - 8, 20, true, true);

            // INTENSITY Label
            ctx.fillStyle = "#94a3b8";
            ctx.font = "bold 13px -apple-system, monospace";
            ctx.fillText("INTENSITY", 28, 38);

            // Intensity Segmented Buttons: LOW, MEDIUM, HIGH
            drawSegmentBtn(ctx, 24, 52, 68, 52, "LOW", state.intensity === "LOW");
            drawSegmentBtn(ctx, 92, 52, 88, 52, "MEDIUM", state.intensity === "MEDIUM");
            drawSegmentBtn(ctx, 180, 52, 74, 52, "HIGH", state.intensity === "HIGH");

            // BIG RED STOP BUTTON
            const stopX = 270;
            const stopY = 28;
            const stopW = 230;
            const stopH = 84;
            ctx.fillStyle = state.eStopActive ? "#991b1b" : "#dc2626"; // Vibrant red
            roundRect(ctx, stopX, stopY, stopW, stopH, 14, true, false);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 26px -apple-system, monospace";
            ctx.textAlign = "center";
            ctx.fillText(state.eStopActive ? "RESET E-STOP" : "STOP", stopX + stopW / 2, stopY + 42);

            ctx.font = "13px -apple-system, monospace";
            ctx.fillText("A button · or laser trigger", stopX + stopW / 2, stopY + 68);

            // EXIT VR BUTTON
            const exitX = 520;
            const exitY = 44;
            const exitW = 100;
            const exitH = 54;
            ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.lineWidth = 1.5;
            roundRect(ctx, exitX, exitY, exitW, exitH, 10, true, true);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 15px -apple-system, monospace";
            ctx.fillText("Exit VR", exitX + exitW / 2, exitY + 33);
            ctx.textAlign = "left"; // Reset

            texture.needsUpdate = true;
        }

        // 4. RIGHT PANEL: ACTIONS, POSTURES & SENSORS (Spread out to right)
        const rightPanel = createHoloPanel(
            1.35, 1.6, 540, 640,
            new THREE.Vector3(1.85, 1.40, -1.95),
            -Math.PI * 0.23, 0 // Angled ~41.4° inward
        );

        function drawRightPanel() {
            const { ctx, canvas: c, texture } = rightPanel;
            ctx.clearRect(0, 0, c.width, c.height);

            // Translucent rounded panel with glowing border
            ctx.fillStyle = "rgba(10, 16, 28, 0.88)";
            ctx.strokeStyle = "rgba(220, 230, 255, 0.9)";
            ctx.lineWidth = 3;
            roundRect(ctx, 4, 4, c.width - 8, c.height - 8, 16, true, true);

            // Header: ACTIONS & POSTURES
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px -apple-system, monospace";
            ctx.fillText("ACTIONS & POSTURES", 32, 48);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px -apple-system, monospace";
            ctx.fillText("DOGZILLA S2 · DIRECT KINEMATICS", 32, 74);

            // Divider Line
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(32, 88);
            ctx.lineTo(c.width - 32, 88);
            ctx.stroke();

            // POSTURES Title
            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 16px -apple-system, monospace";
            ctx.fillText("QUICK POSTURE PRESETS", 32, 118);

            // Posture Tiles: 2 columns x 3 rows
            const postures = [
                { label: "STAND", id: "stand" },
                { label: "SIT", id: "sit" },
                { label: "LIE DOWN", id: "liedown" },
                { label: "BOW", id: "bow" },
                { label: "BALANCE", id: "balance" },
                { label: "WAVE", id: "wave" }
            ];

            const tileW = 224;
            const tileH = 50;
            const startX = 32;
            const startY = 136;
            const gapX = 28;
            const gapY = 14;

            postures.forEach((p, idx) => {
                const col = idx % 2;
                const row = Math.floor(idx / 2);
                const tx = startX + col * (tileW + gapX);
                const ty = startY + row * (tileH + gapY);

                const isActive = (state.lastCommand === p.id);
                ctx.fillStyle = isActive ? "rgba(99, 102, 241, 0.35)" : "rgba(255, 255, 255, 0.08)";
                ctx.strokeStyle = isActive ? "#a5b4fc" : "rgba(255, 255, 255, 0.2)";
                ctx.lineWidth = 1.5;
                roundRect(ctx, tx, ty, tileW, tileH, 10, true, true);

                ctx.fillStyle = isActive ? "#ffffff" : "#d9e6f2";
                ctx.font = "bold 15px -apple-system, monospace";
                ctx.textAlign = "center";
                ctx.fillText(p.label, tx + tileW / 2, ty + 31);
                ctx.textAlign = "left";
            });

            // GAIT & MOTION Title
            const gaitY = startY + 3 * (tileH + gapY) + 20;
            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 16px -apple-system, monospace";
            ctx.fillText("GAIT & LOCOMOTION MODES", 32, gaitY);

            // Gait Buttons: Trot, Crawl
            const gaits = [
                { label: "TROT GAIT (Agile)", id: "trot" },
                { label: "CRAWL GAIT (Stable)", id: "crawl" }
            ];
            gaits.forEach((g, idx) => {
                const tx = startX + idx * (tileW + gapX);
                const ty = gaitY + 16;
                ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
                ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
                ctx.lineWidth = 1.5;
                roundRect(ctx, tx, ty, tileW, tileH, 10, true, true);

                ctx.fillStyle = "#d9e6f2";
                ctx.font = "bold 14px -apple-system, monospace";
                ctx.textAlign = "center";
                ctx.fillText(g.label, tx + tileW / 2, ty + 31);
                ctx.textAlign = "left";
            });

            // AI & VISION Title
            const aiY = gaitY + tileH + 34;
            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 16px -apple-system, monospace";
            ctx.fillText("INTELLIGENCE & SENSORS", 32, aiY);

            // AI Action Buttons
            const aiActions = [
                { label: "AI VISION SCAN", id: "ai_scan" },
                { label: "ZERO IMU HEADING", id: "zero_imu" }
            ];
            aiActions.forEach((a, idx) => {
                const tx = startX + idx * (tileW + gapX);
                const ty = aiY + 16;
                ctx.fillStyle = "rgba(16, 185, 129, 0.15)";
                ctx.strokeStyle = "rgba(16, 185, 129, 0.4)";
                ctx.lineWidth = 1.5;
                roundRect(ctx, tx, ty, tileW, tileH, 10, true, true);

                ctx.fillStyle = "#34d399";
                ctx.font = "bold 14px -apple-system, monospace";
                ctx.textAlign = "center";
                ctx.fillText(a.label, tx + tileW / 2, ty + 31);
                ctx.textAlign = "left";
            });

            // Footer info
            ctx.fillStyle = "#6366f1";
            ctx.beginPath();
            ctx.arc(42, 608, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px -apple-system, monospace";
            ctx.fillText("Point VR laser or mouse click to command", 58, 613);

            texture.needsUpdate = true;
        }

        // --- Helper: Canvas Rounded Rectangle ---
        function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }

        // Render initial panel graphics
        drawLeftPanel();
        drawCenterPanel();
        drawBottomPanel();
        drawRightPanel();

        // --- Interaction: Raycasting & Click Handling ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const virtualStickCenter = { x: 170, y: 480, radius: 92 };
        let virtualJoystickOwner = null;
        let virtualJoystickLastSentAt = 0;
        let virtualJoystickHasSentMotion = false;

        function virtualStickHit(ray) {
            const hit = ray.intersectObject(leftPanel.mesh)[0];
            if (!hit || !hit.uv) return null;
            const x = hit.uv.x * leftPanel.canvas.width;
            const y = (1 - hit.uv.y) * leftPanel.canvas.height;
            return { hit, x, y };
        }

        function updateVirtualStickFromHit(pointer, requireOnPad = false) {
            if (!pointer) {
                virtualJoystickAxes.forward = 0;
                virtualJoystickAxes.turn = 0;
                drawLeftPanel();
                return;
            }
            let dx = (pointer.x - virtualStickCenter.x) / virtualStickCenter.radius;
            let dy = (virtualStickCenter.y - pointer.y) / virtualStickCenter.radius;
            const length = Math.hypot(dx, dy);
            if (requireOnPad && length > 1.35) return false;
            if (length > 1) {
                dx /= length;
                dy /= length;
            }
            if (Math.abs(dx) < 0.12) dx = 0;
            if (Math.abs(dy) < 0.12) dy = 0;
            // Screen-right turns the robot right; positive MotionCommand.turn is left.
            virtualJoystickAxes.turn = -dx;
            virtualJoystickAxes.forward = dy;
            drawLeftPanel();
            return true;
        }

        function setVirtualJoystickOwner(owner, pointer) {
            if (virtualJoystickOwner || !updateVirtualStickFromHit(pointer, true)) return false;
            virtualJoystickOwner = owner;
            virtualJoystickLastSentAt = 0;
            return true;
        }

        function releaseVirtualJoystick(owner) {
            if (virtualJoystickOwner !== owner) return;
            virtualJoystickOwner = null;
            virtualJoystickAxes.forward = 0;
            virtualJoystickAxes.turn = 0;
            virtualJoystickLastSentAt = performance.now();
            const hadMotion = virtualJoystickHasSentMotion;
            virtualJoystickHasSentMotion = false;
            drawLeftPanel();
            if (hadMotion) sendMotionAxes(0, 0, 0);
        }

        function updateVirtualJoystickControls() {
            if (!virtualJoystickOwner) return;
            if (state.eStopActive) {
                virtualJoystickOwner = null;
                virtualJoystickAxes.forward = 0;
                virtualJoystickAxes.turn = 0;
                virtualJoystickHasSentMotion = false;
                drawLeftPanel();
                return;
            }
            if (virtualJoystickOwner !== "mouse") {
                const controller = virtualJoystickOwner;
                const tempMatrix = new THREE.Matrix4();
                tempMatrix.identity().extractRotation(controller.matrixWorld);
                raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
                updateVirtualStickFromHit(virtualStickHit(raycaster));
            }

            const now = performance.now();
            const moving = Math.abs(virtualJoystickAxes.forward) > 0 || Math.abs(virtualJoystickAxes.turn) > 0;
            if (now - virtualJoystickLastSentAt >= 120 && (moving || virtualJoystickHasSentMotion)) {
                sendMotionAxes(
                    virtualJoystickAxes.forward * state.speed,
                    0,
                    virtualJoystickAxes.turn * state.speed
                );
                virtualJoystickHasSentMotion = moving;
                virtualJoystickLastSentAt = now;
            }
        }

        async function handleBottomPanelClick(uvX, uvY) {
            // Intensity Buttons
            if (uvY >= 0.30 && uvY <= 0.75) {
                if (uvX >= 0.03 && uvX <= 0.15) {
                    state.intensity = 'LOW';
                    state.speed = 0.3;
                    playChime(600, 0.05);
                    drawBottomPanel();
                } else if (uvX >= 0.14 && uvX <= 0.29) {
                    state.intensity = 'MEDIUM';
                    state.speed = 0.6;
                    playChime(700, 0.05);
                    drawBottomPanel();
                } else if (uvX >= 0.28 && uvX <= 0.41) {
                    state.intensity = 'HIGH';
                    state.speed = 1.0;
                    playChime(850, 0.05);
                    drawBottomPanel();
                }
            }
            // Stop button
            if (uvX >= 0.42 && uvX <= 0.79 && uvY >= 0.25 && uvY <= 0.85) {
                if (state.eStopActive) await resetEmergencyStop();
                else await stopRobot();
            }
            // Exit VR button
            if (uvX >= 0.80 && uvX <= 0.98 && uvY >= 0.30 && uvY <= 0.75) {
                const session = renderer.xr.getSession();
                if (session) session.end();
            }
        }

        async function handleRightPanelClick(uvX, uvY) {
            playChime(850, 0.08);
            let action = null;
            let posturePreset = null;

            if (uvX >= 0.05 && uvX <= 0.48) {
                if (uvY >= 0.70 && uvY <= 0.80) posturePreset = "stand";
                else if (uvY >= 0.60 && uvY <= 0.70) posturePreset = "liedown";
                else if (uvY >= 0.50 && uvY <= 0.60) posturePreset = "balance";
                else if (uvY >= 0.37 && uvY <= 0.47) action = "trot";
                else if (uvY >= 0.21 && uvY <= 0.31) action = "ai_scan";
            } else if (uvX >= 0.52 && uvX <= 0.95) {
                if (uvY >= 0.70 && uvY <= 0.80) posturePreset = "sit";
                else if (uvY >= 0.60 && uvY <= 0.70) posturePreset = "bow";
                else if (uvY >= 0.50 && uvY <= 0.60) posturePreset = "wave";
                else if (uvY >= 0.37 && uvY <= 0.47) action = "crawl";
                else if (uvY >= 0.21 && uvY <= 0.31) action = "zero_imu";
            }

            if (posturePreset) {
                state.lastCommand = posturePreset;
                drawRightPanel();
                const postureHeights = {
                    stand: "high", liedown: "low", balance: "medium",
                    sit: "low", bow: "medium", wave: "medium"
                };
                recordPreviewCommand(`POSTURE · ${posturePreset.toUpperCase()}`, `height ${postureHeights[posturePreset]}`);
            } else if (action) {
                if (action === "ai_scan") {
                    state.lastCommand = "ai_scan";
                    drawRightPanel();
                    recordPreviewCommand("VISION SCAN");
                } else if (action === "zero_imu") {
                    state.roll = 0;
                    state.pitch = 0;
                    state.lastCommand = "zero_imu";
                    drawCenterPanel();
                    drawRightPanel();
                    recordPreviewCommand("ZERO IMU PREVIEW");
                } else if (action === "trot" || action === "crawl") {
                    state.lastCommand = action;
                    drawRightPanel();
                    recordPreviewCommand(`GAIT · ${action.toUpperCase()}`);
                } else {
                    sendLocomotion(action);
                }
            }
        }

        function dispatchRaycastInteraction(ray) {
            const interactiveMeshes = [bottomPanel.mesh, rightPanel.mesh];
            const hits = ray.intersectObjects(interactiveMeshes);
            if (hits.length > 0) {
                const hit = hits[0];
                const uv = hit.uv;
                if (hit.object === bottomPanel.mesh) {
                    handleBottomPanelClick(uv.x, uv.y);
                } else if (hit.object === rightPanel.mesh) {
                    handleRightPanelClick(uv.x, uv.y);
                }
            }
        }

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            dispatchRaycastInteraction(raycaster);
        });

        // VR Controller Support with Visual Laser Pointers
        function buildLaserPointer() {
            const geo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -3.5)
            ]);
            const mat = new THREE.LineBasicMaterial({
                color: 0x00f0ff,
                transparent: true,
                opacity: 0.55
            });
            return new THREE.Line(geo, mat);
        }

        const controller1 = renderer.xr.getController(0);
        controller1.add(buildLaserPointer());
        scene.add(controller1);

        const controller2 = renderer.xr.getController(1);
        controller2.add(buildLaserPointer());
        scene.add(controller2);

        function setControllerRay(controller) {
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
        }

        function handleControllerSelectStart(controller) {
            setControllerRay(controller);
            const joystickPointer = virtualStickHit(raycaster);
            if (joystickPointer && setVirtualJoystickOwner(controller, joystickPointer)) return;
            dispatchRaycastInteraction(raycaster);
        }

        function handleControllerSelectEnd(controller) {
            releaseVirtualJoystick(controller);
        }

        controller1.addEventListener('selectstart', () => handleControllerSelectStart(controller1));
        controller2.addEventListener('selectstart', () => handleControllerSelectStart(controller2));
        controller1.addEventListener('selectend', () => handleControllerSelectEnd(controller1));
        controller2.addEventListener('selectend', () => handleControllerSelectEnd(controller2));
        renderer.xr.addEventListener('sessionend', () => {
            if (virtualJoystickOwner && virtualJoystickOwner !== "mouse") {
                releaseVirtualJoystick(virtualJoystickOwner);
            }
        });

        // Desktop 360 Drag Look Controls
        let isDragging = false;
        let prevMouseX = 0;
        let prevMouseY = 0;
        let camYaw = 0;
        let camPitch = 0;

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const joystickPointer = virtualStickHit(raycaster);
                if (joystickPointer && setVirtualJoystickOwner("mouse", joystickPointer)) {
                    e.preventDefault();
                    return;
                }
                isDragging = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (virtualJoystickOwner === "mouse") {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                updateVirtualStickFromHit(virtualStickHit(raycaster));
                return;
            }
            if (isDragging && !renderer.xr.isPresenting) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                camYaw -= dx * 0.003;
                camPitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, camPitch - dy * 0.003));
                camera.rotation.set(camPitch, camYaw, 0, 'YXZ');
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            releaseVirtualJoystick("mouse");
        });

        // --- Web Audio & Sound Feedback ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playChime(freq = 600, duration = 0.08) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // --- Gateway-backed, coalescing robot command dispatcher ---
        let isDispatching = false;
        let pendingMotion = null;
        let motionGeneration = 0;

        function sendLocomotion(action, speed = state.speed) {
            if (action === "stop") return stopRobot();
            const magnitude = Math.max(0, Math.min(1, Number(speed) || 0));
            const axes = { forward: 0, strafe: 0, turn: 0 };
            if (action === "forward") axes.forward = magnitude;
            else if (action === "backward") axes.forward = -magnitude;
            else if (action === "strafe_left") axes.strafe = magnitude;
            else if (action === "strafe_right") axes.strafe = -magnitude;
            else if (action === "turn_left") axes.turn = magnitude;
            else if (action === "turn_right") axes.turn = -magnitude;
            else {
                updateCommandStatus("INVALID", `Unsupported motion: ${action}`);
                return;
            }
            sendMotionAxes(axes.forward, axes.strafe, axes.turn);
        }

        function sendMotionAxes(forward, strafe, turn) {
            const command = {
                forward: Math.max(-1, Math.min(1, forward)),
                strafe: Math.max(-1, Math.min(1, strafe)),
                turn: Math.max(-1, Math.min(1, turn)),
                generation: motionGeneration
            };
            state.forward = command.forward;
            state.strafe = command.strafe;
            state.turn = command.turn;
            state.lastCommand = command.forward || command.strafe || command.turn ? "motion" : "stop";
            drawLeftPanel();

            const isStop = !command.forward && !command.strafe && !command.turn;
            if (isStop) return stopRobot();
            if (state.eStopActive) {
                updateCommandStatus("ESTOP_ACTIVE", "Reset the emergency stop before moving");
                return;
            }
            pendingMotion = command;
            if (!isDispatching) void dispatchPendingMotion();
        }

        async function dispatchPendingMotion() {
            isDispatching = true;
            try {
                while (pendingMotion) {
                    const command = pendingMotion;
                    pendingMotion = null;
                    if (state.eStopActive || command.generation !== motionGeneration) continue;
                    const axes = {
                        forward: command.forward,
                        strafe: command.strafe,
                        turn: command.turn
                    };
                    recordPreviewCommand(
                        "DRIVE PREVIEW",
                        `forward ${axes.forward.toFixed(2)} · strafe ${axes.strafe.toFixed(2)} · turn ${axes.turn.toFixed(2)}`
                    );
                }
            } finally {
                isDispatching = false;
                if (pendingMotion) void dispatchPendingMotion();
            }
        }

        async function stopRobot() {
            motionGeneration++;
            pendingMotion = null;
            state.forward = 0;
            state.strafe = 0;
            state.turn = 0;
            state.lastCommand = "stop";
            drawLeftPanel();
            return recordPreviewCommand("STOP PREVIEW");
        }

        async function triggerEmergencyStop() {
            playChime(300, 0.25);
            motionGeneration++;
            pendingMotion = null;
            state.eStopActive = true;
            virtualJoystickOwner = null;
            virtualJoystickAxes.forward = 0;
            virtualJoystickAxes.turn = 0;
            virtualJoystickHasSentMotion = false;
            drawLeftPanel();
            drawBottomPanel();
            return recordPreviewCommand("E-STOP PREVIEW", "Latched locally · no robot command sent");
        }

        async function resetEmergencyStop() {
            state.eStopActive = false;
            drawBottomPanel();
            return recordPreviewCommand("E-STOP RESET PREVIEW");
        }

        // --- Keyboard Controls (WASD / Arrows / Space) ---
        const activeKeys = new Set();
        let keyTeleopInterval = null;

        function updateKeyMovement() {
            const fwd = Number(activeKeys.has('w') || activeKeys.has('arrowup')) - Number(activeKeys.has('s') || activeKeys.has('arrowdown'));
            const strafe = Number(activeKeys.has('a')) - Number(activeKeys.has('d'));
            const turn = Number(activeKeys.has('arrowleft') || activeKeys.has('q')) - Number(activeKeys.has('arrowright') || activeKeys.has('e'));

            state.cmdFwd = fwd;
            state.cmdStrafe = strafe;
            state.cmdTurn = turn;
            drawLeftPanel();

            if (fwd !== 0 || strafe !== 0 || turn !== 0) {
                playChime(750, 0.04);
                sendMotionAxes(fwd * state.speed, strafe * state.speed, turn * state.speed);
            } else {
                sendMotionAxes(0, 0, 0);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const key = e.key.toLowerCase();
            if (key === ' ') {
                e.preventDefault();
                triggerEmergencyStop();
                return;
            }
            if (['w', 's', 'a', 'd', 'q', 'e', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
                activeKeys.add(key);
                updateKeyMovement();
                if (!keyTeleopInterval) {
                    keyTeleopInterval = setInterval(updateKeyMovement, 120);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (activeKeys.has(key)) {
                activeKeys.delete(key);
                updateKeyMovement();
                if (activeKeys.size === 0 && keyTeleopInterval) {
                    clearInterval(keyTeleopInterval);
                    keyTeleopInterval = null;
                }
            }
        });

        // --- Main Render Loop ---
        const clock = new THREE.Clock();
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let lastVideoDrawTime = 0;

        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            planetGroup.rotation.y += delta * 0.05;
            starField.rotation.y -= delta * 0.005;

            // Drive from the in-world virtual joystick while its control is held.
            updateVirtualJoystickControls();

            // Refresh video texture at ~25 FPS
            const now = performance.now();
            if (now - lastVideoDrawTime >= 40) {
                drawCenterPanel();
                lastVideoDrawTime = now;
            }

            // Simple FPS counter calculation
            frameCount++;
            if (now - lastFpsTime >= 1000) {
                state.fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
                frameCount = 0;
                lastFpsTime = now;
            }

            renderer.render(scene, camera);
        });

        // --- Window Resize Handling ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
