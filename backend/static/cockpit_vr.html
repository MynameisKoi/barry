<!DOCTYPE html>

<title>BARRY // VR Cockpit</title>
<!--
  WebXR port of the Unity Barry dashboard (frontend/barry-vr/Assets/Barry/App/Editor/DashboardSceneBuilder.cs).
  Coordinates: Unity is left-handed with +Z forward, three.js is right-handed with -Z forward, so a Unity
  position (x, y, z) becomes (x, y, -z), a Unity yaw a becomes rotation.y = -a and a Unity pitch p becomes
  rotation.x = -p. Panel content is drawn in the Unity builder's mockup px; S = mm per mockup px.
  Origin = operator head at session start, eye height 1.6 m (HANDOFF §4), via an offset "local" reference space.
-->
<style>
  @font-face { font-family: "Inter"; src: url("/static/vendor/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("/static/vendor/fonts/JetBrainsMono.ttf") format("truetype"); font-weight: 100 900; }

<script type="module">
import * as THREE from "three";

// ------------------------------------------------------------------ constants (Unity DashboardSceneBuilder / HANDOFF)
const EYE = 1.6;
const SIDE_PANEL_YAW = 36;              // degrees; Unity comment: 30° in the handoff overlaps the camera screen
// Control strip 35° below the eye line (HANDOFF said 25°): at 25° its top edge rose into the camera screen
// as soon as the head sat a few cm lower than at session start. Tilted 30° so it faces the eye.
const STRIP_BELOW_DEG = 35, STRIP_TILT_DEG = 30;
const DEAD_ZONE = 0.12;                 // InputMapping default
const SEND_HZ = 10;                     // RobotControlService default
const FAILURES_BEFORE_STOP = 3;         // RobotControlService
const ESTOP_HOLD_S = 0.3;               // EmergencyStopGesture: both grips + A held
const CONFIRM_WINDOW_S = 3;             // EmergencyLatch / end-mission confirm
const DETECTION_POLL_MS = 333, DETECTION_MAX_AGE_S = 2;
const ACCEPTED_DISCLAIMER = "Accepted by API · not proof of movement";
const LEVELS = ["LOW", "MEDIUM", "HIGH"];
const ZONES = ["Zone-A", "Zone-B", "Zone-C", "Zone-D"];
const LLM_PRESETS = [
  ["Find a ball", "find:ball"], ["Find a person", "find:person"],
  ["Find a chair", "find:chair"], ["Find a bottle", "find:bottle"],
  ["Look around and tell me what you see", "Look and tell me what you see"],
  ["Walk forward 2 seconds", "Walk forward 2 seconds"],
  ["Turn right 90°", "Turn right 90 degrees"],
  ["Check status", "Check the status"],
  ["What can you do?", "What can you do?"],
];

// Galactic theme tokens (Assets/Barry/Theme/Tokens/Galactic.asset)
const T = {
  envSky: "#0A0F2C", nebulaA: [0x7C / 255, 0x5C / 255, 0xFF / 255, 0.45], nebulaB: [0x2E / 255, 0xC5 / 255, 0xE6 / 255, 0.22],
  planetLight: "#B9A6FF", planetMid: "#5B3FD9", planetDark: "#1E1660", planetRing: "#C9BEFF",
  floor: "#0D1338", floorGrid: "#5EE1FF", platformFill: "#151B4A", platformRim: "#7C5CFF", platformRingDashed: "#5EE1FF",
  panelBg: "rgba(255,255,255,0.94)", panelBorder: "#C9BEFF", panelGlow: "rgba(124,92,255,0.35)", cameraGlow: "rgba(124,92,255,0.55)",
  textPrimary: "#1F1E1B", textSecondary: "#5E5D59", brand: "#2A1F7A", accent: "#5B3FD9", accentSoft: "#ECE8FD",
  rayCore: "#8FEFFF", rayGlow: "#5EE1FF", okText: "#137A3E", okBg: "#E6F4EC", warnText: "#8A4B06", warnBg: "#FEF3E2",
  warnBorder: "#D98A12", dangerSolid: "#C42B2B", dangerText: "#A3201F", dangerSoft: "#FDECEC", neutralFill: "#F3F1EC",
  neutralBorder: "#DAD5CB", videoBg: "#1B1F2E",
  grey3D: "#3D3D3A", grey6B: "#6B6A65", track: "#EFECE6", divider: "#E6E2DA", rowFill: "#F7F5F0", runBorder: "#CFCAC0",
  exitBorder: "#9C978D", reticle: "#4A4F66", camTitle: "#B9BDCF", camSub: "#9EA3B8", chipWhite: "rgba(255,255,255,0.92)",
  leader: "#B9AEEA",
};
const TONES = {
  neutral: { fg: T.textPrimary, bg: T.neutralFill }, ok: { fg: T.okText, bg: T.okBg }, accent: { fg: T.accent, bg: T.accentSoft },
  warn: { fg: T.warnText, bg: T.warnBg }, danger: { fg: T.dangerText, bg: T.dangerSoft },
};
const FONT = { body: '"Inter", system-ui, sans-serif', mono: '"JetBrains Mono", ui-monospace, monospace', brand: '"Orbitron", "Inter", sans-serif' };
const DEG = Math.PI / 180;

// ------------------------------------------------------------------ remote client log (so Quest errors are visible)
const clientLog = [];
function reportClient(level, message) {
  const line = `[${level}] ${String(message).slice(0, 1500)}`;
  clientLog.push(line);
  if (clientLog.length > 50) clientLog.shift();
  if (level === "error") console.error(line); else console.log(line);
  fetch("/api/debug/client-log", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ level, message: String(message).slice(0, 1500), ua: navigator.userAgent.slice(0, 160) }),
  }).catch(() => {});
}
window.addEventListener("error", (e) => reportClient("error", `${e.message} @ ${e.filename}:${e.lineno}`));
window.addEventListener("unhandledrejection", (e) => reportClient("error", `unhandled rejection: ${e.reason?.stack || e.reason}`));

// ------------------------------------------------------------------ app state
const state = {
  connected: false, controlActive: false, rttMs: null, intensity: "MEDIUM", gait: "trot",
  battery: null, roll: null, pitch: null, bodyHeight: "MEDIUM", heightPending: false,
  cameraFps: null, cameraLive: false, cameraUrl: null, cameraZoom: 1.0, cameraFilter: "normal",
  detectionStatus: "unavailable", detections: [], detectionsReceivedAt: 0, detectionsSignature: "",
  sent: { forward: 0, strafe: 0, turn: 0 },          // last command handed to the API (COMMAND SENT bars)
  result: null,                                      // { status, message } of the last refusal, null = disclaimer
  estopLatched: false, latchPhase: "idle", latchUntil: 0, latchError: "",
  mission: null, missionKnown: false, operators: null, operatorsError: "", operatorIndex: 0, zoneIndex: 0,
  missionStarting: false, missionError: "", endArmedUntil: 0, endBusy: false, endError: "", missionHint: false,
  actions: [], actionsError: "", actionsOpen: false, runningAction: null,
  brainOpen: false, llmTask: { state: "idle" }, llmStarting: false, llmCancelling: false, llmReplaced: false, llmError: "",
  teleop: "DISARMED", needCentre: true, failures: 0,
};
const hasControl = () => Boolean(controlSessionId);

// ------------------------------------------------------------------ push-to-talk voice (POST /api/v1/voice/command)
// Hold Y (or V / the HUD button on desktop): record from the headset mic, release to send. The backend transcribes,
// runs a matched command (forward/back N s, turn left/right N°, stop, emergency stop) as source "voice", or hands
// anything else to the LLM brain. Max 15 s per clip (the router's limit).
const VOICE_HOLD_S = 0.35, VOICE_MAX_MS = 15000;
const voice = { phase: "idle", stream: null, recorder: null, chunks: [], timer: null, startedAt: 0, level: 0, analyser: null, audioContext: null, dataArray: null };
state.voice = { phase: "idle", text: "" };
let audioCtx = null;
function chime(freq, ms) {
  try {
    audioCtx = audioCtx || new AudioContext();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + ms / 1000);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + ms / 1000);
  } catch (e) {}
}
function setupVoiceAnalyser(stream) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx || !stream) return;
    if (!voice.audioContext || voice.audioContext.state === "closed") {
      voice.audioContext = new AudioCtx();
    }
    if (voice.audioContext.state === "suspended") {
      voice.audioContext.resume().catch(() => {});
    }
    const sourceNode = voice.audioContext.createMediaStreamSource(stream);
    voice.analyser = voice.audioContext.createAnalyser();
    voice.analyser.fftSize = 64;
    sourceNode.connect(voice.analyser);
    voice.dataArray = new Uint8Array(voice.analyser.frequencyBinCount);
  } catch (_) {
    voice.analyser = null;
  }
}
function updateVoiceLevel() {
  if (voice.phase !== "recording" || !voice.analyser || !voice.dataArray) {
    voice.level = 0;
    return 0;
  }
  try {
    voice.analyser.getByteFrequencyData(voice.dataArray);
    let sum = 0;
    for (let i = 0; i < voice.dataArray.length; i++) sum += voice.dataArray[i];
    const avg = sum / (voice.dataArray.length || 1);
    voice.level = Math.min(1.0, Math.max(0.0, avg / 128.0));
  } catch (_) {
    voice.level = 0;
  }
  return voice.level;
}
function setVoice(phase, text = "") { state.voice = { phase, text }; markDirty("header", "status", "strip"); }
async function ensureMic() {
  if (voice.stream && voice.stream.active) return voice.stream;
  if (!navigator.mediaDevices?.getUserMedia) throw new Error(window.isSecureContext ? "no microphone API" : "microphone needs HTTPS or the chrome://flags origin");
  voice.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  setupVoiceAnalyser(voice.stream);
  return voice.stream;
}
async function startTalking() {
  if (voice.phase !== "idle") return;
  voice.phase = "starting";
  try {
    const stream = await ensureMic();
    if (voice.phase !== "starting") return;              // released before the mic opened
    const type = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find((t) => window.MediaRecorder?.isTypeSupported?.(t)) || "";
    voice.recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    voice.chunks = [];
    voice.recorder.ondataavailable = (e) => { if (e.data && e.data.size) voice.chunks.push(e.data); };
    voice.recorder.onstop = () => sendClip(new Blob(voice.chunks, { type: voice.recorder.mimeType || "audio/webm" }));
    voice.recorder.start();
    voice.phase = "recording"; voice.startedAt = performance.now();
    voice.timer = setTimeout(stopTalking, VOICE_MAX_MS);
    chime(880, 90); setVoice("listening");
  } catch (err) {
    voice.phase = "idle";
    setVoice("error", `Mic unavailable: ${err.name === "NotAllowedError" ? "permission denied" : err.message || err.name}`);
    reportClient("error", `voice mic: ${err.name} ${err.message}`);
  }
}
function stopTalking() {
  clearTimeout(voice.timer);
  voice.level = 0;
  if (voice.phase === "starting") { voice.phase = "idle"; return; }
  if (voice.phase !== "recording") return;
  voice.phase = "sending"; chime(520, 90);
  try { voice.recorder.stop(); } catch (e) { voice.phase = "idle"; }
}
async function sendClip(blob) {
  if (performance.now() - voice.startedAt < 300 || blob.size < 500) { voice.phase = "idle"; voice.level = 0; setVoice("error", "Too short: hold Y while you speak"); return; }
  setVoice("sending", "Transcribing…");
  const ext = blob.type.includes("mp4") ? "m4a" : "webm";
  const form = new FormData(); form.append("audio", blob, `clip.${ext}`);
  try {
    const r = await fetch("/api/v1/voice/command", { method: "POST", body: form });
    const p = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(p.detail || `HTTP ${r.status}`);
    const said = p.transcript ? `“${p.transcript}”` : "(nothing heard)";
    if (p.matched) {
      const res = p.command_result || {};
      const st = String(res.status || "sent").toUpperCase();
      setVoice("done", `${said} → ${p.command}${p.args && Object.keys(p.args).length ? " " + Object.values(p.args).join(" ") : ""} · ${st}`);
      if (p.command === "emergency_stop") latchEstop();
    } else {
      setVoice("done", `${said} → Brain`);
      if (p.task) { state.llmTask = p.task; state.brainOpen = true; markDirty("brain"); pollLlm(); }
    }
  } catch (err) {
    setVoice("error", `Voice failed: ${err.message}`);
  } finally { voice.phase = "idle"; voice.level = 0; }
}

// ------------------------------------------------------------------ HTTP (control session + sequenced commands)
let controlSessionId = null;
let commandSequence = 0;
let sessionRequest = null;

async function acquireControlSession() {
  if (sessionRequest) return sessionRequest;
  sessionRequest = (async () => {
    try {
      const r = await fetch("/api/v1/session", { method: "POST" });
      const p = await r.json().catch(() => ({}));
      if (r.ok && p.session_id) { controlSessionId = p.session_id; commandSequence = 0; }
    } catch (e) { /* status poll reports OFFLINE */ }
    finally { sessionRequest = null; markDirty("header", "status", "actions"); }
  })();
  return sessionRequest;
}

function commandStatus(payload, response) {
  const detail = String(payload?.detail || payload?.message || "");
  const refusal = detail.match(/^(MISSION_REQUIRED|BUSY|ESTOP_ACTIVE|OFFLINE|INVALID)\s*:/i);
  if (refusal) return refusal[1].toUpperCase();
  if (payload?.status && String(payload.status).toUpperCase() !== "REJECTED") return String(payload.status).toUpperCase();
  return response.ok ? "ACCEPTED" : `HTTP_${response.status}`;
}

const isStaleSession = (r, p) => r.status === 409 && /control session|sequence/i.test(String(p?.detail || ""));

/** POST a command. Sequenced commands carry the control-session headers; a stale session is re-acquired and the
 *  command retried ONCE, and only if `stillWanted()` says it is still current (never a blind retry). */
async function api(path, { body = null, sequenced = false, source = "hand", stillWanted = null, retried = false } = {}) {
  if (sequenced && !controlSessionId) await acquireControlSession();
  if (stillWanted && !stillWanted()) return null;
  const headers = { "X-Command-Source": source, "X-Command-Id": crypto.randomUUID ? crypto.randomUUID() : String(Math.random()) };
  if (body !== null) headers["Content-Type"] = "application/json";
  if (sequenced && controlSessionId) {
    headers["X-Control-Session"] = controlSessionId;
    headers["X-Command-Seq"] = String(++commandSequence);
    headers["X-Command-Sent-At"] = String(Date.now());
  }
  const started = performance.now();
  try {
    const response = await fetch(path, { method: "POST", headers, body: body === null ? undefined : JSON.stringify(body) });
    const payload = await response.json().catch(() => ({}));
    if (sequenced && !retried && isStaleSession(response, payload)) {
      controlSessionId = null;
      await acquireControlSession();
      if (controlSessionId && (!stillWanted || stillWanted())) return api(path, { body, sequenced, source, stillWanted, retried: true });
    }
    const status = commandStatus(payload, response);
    const message = String(payload.detail || payload.message || "").replace(/^[A-Z_]+\s*:\s*/, "");
    if (status === "ESTOP_ACTIVE") latchEstop();
    const ok = response.ok && !/^HTTP_|^(MISSION_REQUIRED|BUSY|ESTOP_ACTIVE|OFFLINE|INVALID)$/.test(status);
    return { ok, status, message, payload, ms: performance.now() - started };
  } catch (error) {
    return { ok: false, status: "OFFLINE", message: error.message || "Backend unreachable", payload: {}, ms: performance.now() - started, network: true };
  }
}

function showResult(res) {
  if (!res) return;
  state.result = res.ok ? null : { status: res.status, message: res.message };
  markDirty("status");
}

// ------------------------------------------------------------------ teleop: motion, stop, e-stop (HANDOFF §6/§7)
let pendingMotion = null, dispatching = false, motionGeneration = 0;

function sendMotion(axes) {
  if (state.estopLatched) return;
  pendingMotion = { ...axes, generation: motionGeneration };
  if (!dispatching) dispatchMotion();
}

async function dispatchMotion() {
  dispatching = true;
  try {
    while (pendingMotion) {                                  // one request in flight, latest wins
      const cmd = pendingMotion; pendingMotion = null;
      if (state.estopLatched || cmd.generation !== motionGeneration) continue;
      const { generation, ...axes } = cmd;
      const res = await api("/api/v1/motion", { body: axes, sequenced: true, stillWanted: () => generation === motionGeneration && !state.estopLatched });
      if (!res) continue;
      if (res.ok) { state.failures = 0; if (generation === motionGeneration) state.sent = axes; }
      else if (res.network || /^HTTP_5/.test(res.status) || res.status === "OFFLINE") {
        if (++state.failures >= FAILURES_BEFORE_STOP) { state.failures = 0; stopRobot("Unreliable link · 3 failed motion commands"); }
      }
      showResult(res);
    }
  } finally {
    dispatching = false;
    if (pendingMotion) dispatchMotion();
  }
}

// ------------------------------------------------------------------ haptics
function pulseHaptic(c, intensity = 0.5, durationMs = 25) {
  const gp = c?.source?.gamepad;
  const act = gp?.hapticActuators?.[0];
  if (act && typeof act.pulse === "function") {
    try { act.pulse(Math.min(1.0, Math.max(0.0, intensity)), durationMs); } catch (_) {}
  }
}
function pulseAllHaptics(intensity = 0.7, durationMs = 100) {
  if (Array.isArray(controllers)) {
    for (const c of controllers) pulseHaptic(c, intensity, durationMs);
  }
}

/** STOP: supersedes queued motion, needs sticks centred before the next drive (no auto-resume). */
function stopRobot(reason = "") {
  motionGeneration++;
  pendingMotion = null;
  state.sent = { forward: 0, strafe: 0, turn: 0 };
  state.teleop = "STOPPED";
  state.needCentre = true;
  pulseAllHaptics(0.6, 60);
  markDirty("status", "actions");
  api("/api/v1/stop").then((res) => {
    if (res && res.ok && reason) state.result = { status: "STOPPED", message: reason };
    else showResult(res);
    markDirty("status");
  });
}

function latchEstop() {
  if (!state.estopLatched) { state.estopLatched = true; state.latchPhase = "idle"; state.latchError = ""; }
  motionGeneration++; pendingMotion = null; state.needCentre = true; state.teleop = "STOPPED";
  state.sent = { forward: 0, strafe: 0, turn: 0 };
  pulseAllHaptics(1.0, 300);
  markDirty("header", "status", "banner", "actions");
}

function triggerEmergencyStop() {
  latchEstop();
  api("/api/v1/emergency-stop", { source: "emergency" }).then(showResult);
}

async function pressResetEstop() {
  if (!state.estopLatched || state.latchPhase === "resetting") return;
  const now = performance.now();
  if (state.latchPhase !== "confirming" || now > state.latchUntil) {   // first press arms, second confirms
    state.latchPhase = "confirming"; state.latchUntil = now + CONFIRM_WINDOW_S * 1000;
    markDirty("banner");
    return;
  }
  state.latchPhase = "resetting"; markDirty("banner");
  const res = await api("/api/v1/emergency-stop/reset", { sequenced: true });
  if (res && res.ok) { state.estopLatched = false; state.latchPhase = "idle"; state.latchError = ""; state.needCentre = true; state.result = null; }
  else { state.latchPhase = "idle"; state.latchError = res ? `${res.status}: ${res.message}`.trim() : "Reset failed."; }
  markDirty("header", "banner", "status");
}

async function setIntensity(level) {
  const res = await api("/api/v1/movement-style", { body: { intensity: level.toLowerCase(), gait: state.gait }, sequenced: true });
  if (res && res.ok) state.intensity = level;
  showResult(res);
  markDirty("strip");
}
function applyBodyHeight(payload) {
  const height = payload?.control_state?.posture?.height;
  if (typeof height === "string" && LEVELS.includes(height.toUpperCase())) {
    state.bodyHeight = height.toUpperCase(); markDirty("bodyHeight");
  }
}
async function setBodyHeight(level) {
  if (state.heightPending || !LEVELS.includes(level)) return;
  state.heightPending = true; markDirty("bodyHeight");
  try {
    const res = await api("/api/v1/posture", { body: { height: level.toLowerCase(), pitch: 0 }, sequenced: true });
    if (res?.ok) { state.bodyHeight = level; applyBodyHeight(res.payload); }
    showResult(res);
  } finally { state.heightPending = false; markDirty("bodyHeight"); }
}
const cycleIntensity = () => setIntensity(LEVELS[(LEVELS.indexOf(state.intensity) + 1) % LEVELS.length]);

// Axis pipeline: radial dead zone + rescale, clamp, 2 dp (InputMapping). Positive strafe/turn = left.
function radial(x, y) {
  const m = Math.hypot(x, y);
  if (!(m > DEAD_ZONE)) return [0, 0];
  const s = Math.min(1, (m - DEAD_ZONE) / (1 - DEAD_ZONE)) / m;
  return [x * s, y * s];
}
const r2 = (v) => Math.round(Math.max(-1, Math.min(1, v)) * 100) / 100 || 0;

let lastSample = 0;
function teleopTick(now, axes, source) {
  if (now - lastSample < 1000 / SEND_HZ) return;
  lastSample = now;
  const centred = !axes.forward && !axes.strafe && !axes.turn;
  if (state.estopLatched) return;
  if (state.needCentre) {                       // after any stop: sticks must be centred first
    if (centred) { state.needCentre = false; state.teleop = "ARMED"; markDirty("status", "actions"); }
    return;
  }
  if (!centred) {
    if (state.teleop !== "DRIVING") { state.teleop = "DRIVING"; markDirty("actions"); }
    sendMotion(axes);                           // keep-alive every sample while deflected
  } else if (state.teleop === "DRIVING") {
    state.teleop = "ARMED";                     // release = explicit stop
    motionGeneration++; pendingMotion = null;
    state.sent = { forward: 0, strafe: 0, turn: 0 };

// Brain answer scrolling uses whole lines and never changes driving axes.
function scrollBrain(lines) {
  state.brainScroll = Math.max(0, Math.min(state.brainScrollMax || 0, (state.brainScroll || 0) + lines));
  markDirty("brain");
}
function scrollBrainStick(controller, axis, pointing, now) {
  if (!state.brainOpen || !pointing || Math.abs(axis) <= DEAD_ZONE) { controller.brainScrollAt = 0; return; }
  if (!controller.brainScrollAt || now - controller.brainScrollAt >= 150) {
    scrollBrain(axis > 0 ? 1 : -1); controller.brainScrollAt = now;
  }
}
let snapshotImg = null, snapshotSrc = null;
function getSnapshotImage(src) {
  if (!src || typeof Image === "undefined") return null;
  if (snapshotSrc !== src) {
    snapshotSrc = src;
    snapshotImg = new Image();
    snapshotImg.onload = () => markDirty("brain");
    snapshotImg.src = src;
  }
  return (snapshotImg && snapshotImg.complete && snapshotImg.naturalWidth) ? snapshotImg : null;
}

function drawBrainAnswer(ctx, p, answer, task, running) {
  const key = JSON.stringify([task.id, answer]);
  if (state.brainAnswerKey !== key) { state.brainAnswerKey = key; state.brainScroll = 0; }
  const y = running ? 738 : 480, h = 812 - y, size = p.fs(26), lineHeight = size * 1.25;
  const snap = (!running && task.found_snapshot) ? getSnapshotImage(task.found_snapshot) : null;
  const textX = snap ? 198 : 28, width = snap ? 312 : 482;
  if (snap) {
    fillRR(ctx, 28, y, 156, 104, 10, T.videoBg, T.accent, 2);
    try { ctx.drawImage(snap, 30, y + 2, 152, 100); } catch (_) {}
    txt(ctx, "TARGET SPOTTED", 28, y + 108, 156, 20, { size: p.fs(12), weight: 700, font: "mono", color: T.accent, align: "center" });
  }
  setFont(ctx, size, { weight: 700 });
  const lines = [];
  for (const paragraph of String(answer).split("\n")) {
    let line = "";

  } catch (e) {}
}

// Live video and detections share this letterboxed rectangle inside the camera screen's 10 px inset.
const videoCanvas = document.createElement("canvas"); videoCanvas.width = 640; videoCanvas.height = 360;
const videoCtx = videoCanvas.getContext("2d");
const videoTex = new THREE.CanvasTexture(videoCanvas); videoTex.colorSpace = THREE.SRGBColorSpace;
const VIDEO_INSET = 10, VIDEO_INNER_W = 860, VIDEO_INNER_H = 475;
function containedVideoRect(w, h) {
  if (!(w > 0 && h > 0)) return { x: VIDEO_INSET, y: VIDEO_INSET, w: 0, h: 0 };
  const aspect = w / h;
  let vw = VIDEO_INNER_W, vh = VIDEO_INNER_W / aspect;
  if (vh > VIDEO_INNER_H) { vh = VIDEO_INNER_H; vw = VIDEO_INNER_H * aspect; }
  return { x: VIDEO_INSET + (VIDEO_INNER_W - vw) / 2, y: VIDEO_INSET + (VIDEO_INNER_H - vh) / 2, w: vw, h: vh };
}
const videoMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: videoTex, toneMapped: false }));
videoMesh.renderOrder = 2; videoMesh.visible = false;
P.camera.group.add(videoMesh); videoMesh.position.z = 0.002;
let lastVideoDraw = 0, videoW = 0, videoH = 0;
function updateVideo(now) {
  if (now - lastVideoDraw < 40) return;
  lastVideoDraw = now;
  const w = cameraImg.naturalWidth, h = cameraImg.naturalHeight;
  const live = cameraImg.complete && w > 0 && h > 0;
  if (live !== state.cameraLive) { state.cameraLive = live; markDirty("cameraOverlay"); }
  videoMesh.visible = live;
  if (!live) return;
  if (w !== videoW || h !== videoH) {
    videoW = w; videoH = h;
    videoCanvas.width = Math.min(1280, w); videoCanvas.height = Math.round(videoCanvas.width * h / w);
    videoTex.dispose();                                         // texture size changed
    const rect = containedVideoRect(w, h);
    videoMesh.scale.set(rect.w * S_FAR / 1000, rect.h * S_FAR / 1000, 1);
    markDirty("cameraOverlay");
  }
  try {
    const filterObj = FILTER_PRESETS.find((f) => f.id === state.cameraFilter);
    videoCtx.filter = filterObj ? filterObj.css : "none";
    if (state.cameraZoom && state.cameraZoom > 1.0) {
      const zw = w / state.cameraZoom, zh = h / state.cameraZoom;
      const zx = (w - zw) / 2, zy = (h - zh) / 2;
      videoCtx.drawImage(cameraImg, zx, zy, zw, zh, 0, 0, videoCanvas.width, videoCanvas.height);
    } else {
      videoCtx.drawImage(cameraImg, 0, 0, videoCanvas.width, videoCanvas.height);
    }
    videoTex.needsUpdate = true;
  } catch (e) { /* frame not decodable yet */ }
}

function clickTarget(h) { if (h?.target?.enabled && h.target.onClick) { h.target.onClick(); h.panel.dirty = true; } }
/** Starts a press-and-hold target under the pointer; returns it so the caller can release it later. */
function pressTarget(h) { if (h?.target?.enabled && h.target.onPress) { h.target.onPress(); h.panel.dirty = true; return h.target; } return null; }
function releaseTarget(t) { if (t?.onRelease) t.onRelease(); markDirty("strip"); }

for (let i = 0; i < 2; i++) {
  const target = renderer.xr.getController(i);
  const grip = renderer.xr.getControllerGrip(i);
  const ray = buildRay(); target.add(ray);
  const cur = buildCursor(); cur.visible = false; scene.add(cur);
  const c = { index: i, target, grip, ray, cursor: cur, source: null, hand: null, hover: null, hoverKey: null, prev: {}, tips: null, grab: null };
  target.addEventListener("connected", (e) => {
    c.source = e.data; c.hand = e.data.handedness;
    if (c.tips) grip.remove(c.tips);
    if (c.hand === "left" || c.hand === "right") { c.tips = buildTooltips(c.hand); c.tips.rotation.x = -1.1; c.tips.position.set(0, 0.03, 0.02); grip.add(c.tips); }
  });
  target.addEventListener("disconnected", () => {
    if (state.teleop === "DRIVING") stopRobot("Controller lost");     // tracking lost while driving → STOP
    if (c.holding) { releaseTarget(c.holding); c.holding = null; }
    c.source = null; c.hand = null; cur.visible = false; setHover(c, null);
  });
  target.addEventListener("selectstart", () => {
    c.holding = pressTarget(c.hover);
    if (!c.holding) { if (clickTarget(c.hover)) pulseHaptic(c, 0.4, 25); }
    else pulseHaptic(c, 0.4, 25);
  });
  target.addEventListener("selectend", () => { if (c.holding) { releaseTarget(c.holding); c.holding = null; pulseHaptic(c, 0.3, 20); } });
  target.addEventListener("squeezestart", () => startGrab(c));
  target.addEventListener("squeezeend", () => { if (c.grab) { c.grab = null; saveLayout(); pulseHaptic(c, 0.3, 20); } });
  scene.add(target); scene.add(grip);
  controllers.push(c);
}

// Per-frame controller handling: rays/cursor, buttons (A STOP, grips+A e-stop, B actions, X intensity, Y brain), sticks.
const tmpMat = new THREE.Matrix4(), tmpOrigin = new THREE.Vector3(), tmpDir = new THREE.Vector3(), tmpQuat = new THREE.Quaternion();
let estopHeld = 0, resetHeld = 0;
const allPanelMeshes = Object.values(panels).map((p) => p.mesh);
const grabMat = new THREE.Matrix4(), headPos = new THREE.Vector3();
/** Nearest opaque panel under the controller ray (any panel, including the non-clickable screen). */
function pickPanel(c) {
  tmpMat.identity().extractRotation(c.target.matrixWorld);
  raycaster.set(tmpOrigin.setFromMatrixPosition(c.target.matrixWorld), tmpDir.set(0, 0, -1).applyMatrix4(tmpMat));
  for (const hit of raycaster.intersectObjects(allPanelMeshes.filter((m) => m.visible), false)) {
    if (hit.uv && hit.object.userData.panel.hit(hit.uv)) return hit.object.userData.panel;
  }
  return null;
}
function startGrab(c) {
  if (c.grab || !c.source) return false;
  const panel = pickPanel(c);
  if (!panel) return false;
  const root = panel.moveRoot;
  if (controllers.some((o) => o !== c && o.grab?.root === root)) return false;
  root.updateMatrixWorld();
  c.grab = { root, offset: grabMat.copy(c.target.matrixWorld).invert().multiply(root.matrixWorld).clone() };
  pulseHaptic(c, 0.5, 30);
  return true;
}
/** Follow the hand, keep the panel upright and facing the head. */
function updateGrab(c) {
  const { root, offset } = c.grab;
  grabMat.multiplyMatrices(c.target.matrixWorld, offset);
  root.position.setFromMatrixPosition(grabMat);
  renderer.xr.getCamera().getWorldPosition(headPos);
  headPos.y = root.position.y;                       // yaw only: panels stay upright
  if (headPos.distanceToSquared(root.position) > 1e-4) root.lookAt(headPos);
}
function updateControllers(now, dt) {
  let lx = 0, ly = 0, rx = 0, lGrip = false, rGrip = false, aHeld = false;
  for (const c of controllers) {
    const src = c.source;
    if (!src) { c.cursor.visible = false; continue; }
    tmpMat.identity().extractRotation(c.target.matrixWorld);
    tmpOrigin.setFromMatrixPosition(c.target.matrixWorld);
    tmpDir.set(0, 0, -1).applyMatrix4(tmpMat);
    const res = pick(tmpOrigin, tmpDir);
    setHover(c, res);
    if (res) {
      c.ray.userData.setLength(res.hit.distance);
      c.cursor.visible = true; c.cursor.position.copy(res.hit.point);
      c.cursor.quaternion.copy(res.hit.object.getWorldQuaternion(tmpQuat)); c.cursor.translateZ(0.003);
    } else { c.ray.userData.setLength(3); c.cursor.visible = false; }
    const gp = src.gamepad; if (!gp) continue;
    const b = (i) => Boolean(gp.buttons[i]?.pressed);
    const edge = (i) => { const p = b(i); const was = c.prev[i]; c.prev[i] = p; return p && !was; };
    const ax = gp.axes.length >= 4 ? [gp.axes[2], gp.axes[3]] : [gp.axes[0] || 0, gp.axes[1] || 0];
    if (c.hand === "left") {
      [lx, ly] = ax; lGrip = b(1);
      if (edge(4)) { cycleIntensity(); pulseHaptic(c, 0.4, 25); }               // X
      // Y: tap toggles the Brain panel (Unity), hold >= 0.35 s = push-to-talk.
      if (b(5)) {
        c.yHeld = (c.yHeld || 0) + dt;
        if (c.yHeld >= VOICE_HOLD_S && !c.yTalking) { c.yTalking = true; startTalking(); pulseHaptic(c, 0.5, 35); }
      } else if (c.yHeld) {
        if (c.yTalking) { stopTalking(); pulseHaptic(c, 0.3, 25); }
        else { state.brainOpen = !state.brainOpen; markDirty("brain"); pulseHaptic(c, 0.4, 20); }
        c.yHeld = 0; c.yTalking = false;
      }
    } else if (c.hand === "right") {
      scrollBrainStick(c, ax[1], pickPanel(c) === panels.brain, now);
      rx = ax[0]; rGrip = b(1); aHeld = b(4);
      if (edge(4)) { stopRobot("Stopped by you"); pulseHaptic(c, 0.8, 80); }     // A = STOP (highest priority)
      if (edge(5)) { toggleActions(); pulseHaptic(c, 0.4, 25); }                 // B
    }
  }
  // Dedicated e-stop: both grips + A held 0.3 s (EmergencyStopGesture). A alone already sent STOP.
  if (lGrip && rGrip && aHeld) { estopHeld += dt; if (estopHeld >= ESTOP_HOLD_S && !state.estopLatched) triggerEmergencyStop(); }
  else estopHeld = 0;
  // Moving a panel pauses driving: the sticks read as centred (a drive in progress gets its release-stop).
  let grabbing = false;
  for (const c of controllers) if (c.grab) { grabbing = true; if (c.source) updateGrab(c); else c.grab = null; }
  if (grabbing) { lx = ly = rx = 0; }
  // Reset layout: both thumbsticks clicked in and held 1 s.
  const sticksDown = controllers.filter((c) => c.source?.gamepad?.buttons[3]?.pressed).length === 2;
  if (sticksDown) { resetHeld += dt; if (resetHeld >= 1 && resetHeld - dt < 1) { resetLayout(); pulseAllHaptics(0.7, 120); state.result = { status: "LAYOUT", message: "Panel layout reset" }; markDirty("status"); } }
  else resetHeld = 0;
  const [sx, sy] = radial(lx, ly); const [tx] = radial(rx, 0);
  teleopTick(now, { forward: r2(-sy), strafe: r2(-sx), turn: r2(-tx) }, "hand");
}

// ------------------------------------------------------------------ desktop: mouse look/click, armed keyboard
let dragging = false, dragMoved = 0, yaw = 0, pitch = 0, lastX = 0, lastY = 0;
const mouseOwner = { hover: null, hoverKey: null };
const ndc = new THREE.Vector2();
function mousePick(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  setHover(mouseOwner, pick(raycaster.ray.origin.clone(), raycaster.ray.direction.clone()));
}
renderer.domElement.addEventListener("wheel", (e) => {
  if (renderer.xr.isPresenting || !state.brainOpen) return;
  mousePick(e);
  const hit = pick(raycaster.ray.origin.clone(), raycaster.ray.direction.clone());
  if (hit?.panel === panels.brain && e.deltaY) { e.preventDefault(); scrollBrain(e.deltaY > 0 ? 1 : -1); }
}, { passive: false });
let mouseHolding = null;
renderer.domElement.addEventListener("pointerdown", (e) => {
  if (!renderer.xr.isPresenting) { mousePick(e); mouseHolding = pressTarget(mouseOwner.hover); if (mouseHolding) return; }
  dragging = true; dragMoved = 0; lastX = e.clientX; lastY = e.clientY;
});
addEventListener("pointermove", (e) => {
  if (renderer.xr.isPresenting) return;
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY; dragMoved += Math.abs(dx) + Math.abs(dy);
    yaw -= dx * 0.004; pitch = Math.max(-1.2, Math.min(1.2, pitch - dy * 0.004));
    camera.rotation.set(pitch, yaw, 0, "YXZ"); lastX = e.clientX; lastY = e.clientY;
  }
  mousePick(e);
});
addEventListener("pointerup", (e) => {
  if (mouseHolding) { releaseTarget(mouseHolding); mouseHolding = null; return; }
  const wasDrag = dragging && dragMoved >= 6; dragging = false;
  if (!wasDrag && !renderer.xr.isPresenting && e.target === renderer.domElement) { mousePick(e); clickTarget(mouseOwner.hover); }
});

const keys = new Set();
const armKeys = document.getElementById("arm-keys");
armKeys.addEventListener("change", () => {
  document.getElementById("sim-banner").style.display = armKeys.checked ? "block" : "none";
  if (!armKeys.checked && state.teleop === "DRIVING") stopRobot("Keyboard disarmed");
  keys.clear(); armKeys.blur();
});
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); stopRobot("Stopped by you"); return; }            // STOP always works
  if (!armKeys.checked || e.repeat) return;
  if (k === "i") cycleIntensity();
  else if (k === "tab") { e.preventDefault(); toggleActions(); }
  else keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); if (state.teleop === "DRIVING") stopRobot("Window lost focus"); });
function keyboardAxes() {
  const v = (a, b) => Number(keys.has(a)) - Number(keys.has(b));
  return { forward: v("w", "s"), strafe: v("a", "d"), turn: v("q", "e") };
}

// ------------------------------------------------------------------ Enter VR (reason shown when unavailable)
const vrButton = document.getElementById("enter-vr"), vrReason = document.getElementById("vr-reason");
async function setupVr() {
  if (!("xr" in navigator)) {
    vrButton.textContent = "VR UNAVAILABLE";
    vrReason.textContent = window.isSecureContext ? "This browser has no WebXR." :
      `WebXR is blocked on plain HTTP. In the Quest browser open chrome://flags, enable "Insecure origins treated as secure" for ${location.origin}, then relaunch.`;
    return;
  }
  const ok = await navigator.xr.isSessionSupported("immersive-vr").catch(() => false);
  if (!ok) { vrButton.textContent = "VR NOT SUPPORTED"; vrReason.textContent = "No immersive-vr on this device (desktop preview only)."; return; }
  vrButton.disabled = false; vrButton.textContent = "ENTER VR"; vrReason.textContent = "";
  vrButton.onclick = async () => {
    try {
      const session = await navigator.xr.requestSession("immersive-vr", { optionalFeatures: ["local-floor", "bounded-floor", "hand-tracking"] });
      session.addEventListener("end", onSessionEnd);
      session.addEventListener("visibilitychange", () => { if (session.visibilityState !== "visible" && state.teleop === "DRIVING") stopRobot("Headset focus lost"); });
      await renderer.xr.setSession(session);
      // Origin = head at session start, lifted to the 1.6 m eye height the layout is built for.
      const base = renderer.xr.getReferenceSpace();
      renderer.xr.setReferenceSpace(base.getOffsetReferenceSpace(new XRRigidTransform({ x: 0, y: -EYE, z: 0 })));
      state.needCentre = true;
      vrButton.textContent = "EXIT VR"; vrButton.onclick = () => session.end();
      reportClient("info", "XR session started");
      markDirty("strip");
    } catch (err) {
      vrReason.textContent = `VR failed to start: ${err.name || ""} ${err.message || err}`;
      reportClient("error", `requestSession/setSession failed: ${err.name} ${err.message}`);
    }
  };
}
function onSessionEnd() {
  if (state.teleop === "DRIVING" || pendingMotion) stopRobot("VR session ended");
  for (const c of controllers) { c.source = null; c.cursor.visible = false; }
  setupVr(); markDirty("strip");
  camera.position.set(0, EYE, 0); camera.rotation.set(pitch, yaw, 0, "YXZ");
}
document.addEventListener("visibilitychange", () => { if (document.hidden && state.teleop === "DRIVING") stopRobot("App paused"); });

// ------------------------------------------------------------------ main loop
let lastFrame = performance.now(), lastRedraw = 0, frames = 0;
renderer.setAnimationLoop(() => {
  const now = performance.now(); const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  try {
    if (renderer.xr.isPresenting) updateControllers(now, dt);
    else if (armKeys.checked) teleopTick(now, keyboardAxes(), "hand");
    updateVideo(now);
    if (state.latchPhase === "confirming") { if (now > state.latchUntil) state.latchPhase = "idle"; markDirty("banner"); }
    if (state.endArmedUntil) { if (now > state.endArmedUntil) state.endArmedUntil = 0; markDirty("strip"); }
    if (state.voice?.phase === "listening") { updateVoiceLevel(); markDirty("header", "strip"); }
    if (now - lastRedraw > 50) { lastRedraw = now; for (const p of Object.values(panels)) if (p.dirty) p.redraw(); }
  } catch (err) { if (!window.__loopErr) { window.__loopErr = true; reportClient("error", `frame: ${err.stack || err}`); } }
  renderer.render(scene, camera);
  if (++frames === 120 && renderer.xr.isPresenting) reportClient("info", "XR rendered 120 frames");
});
addEventListener("resize", () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
renderer.xr.addEventListener("sessionstart", () => { frames = 0; });

// ------------------------------------------------------------------ start
Promise.all([
  document.fonts.load('700 20px "Inter"'), document.fonts.load('700 20px "JetBrains Mono"'), document.fonts.load('800 20px "Orbitron"'),
]).catch(() => {}).finally(() => { for (const p of Object.values(panels)) p.dirty = true; });
setupVr();
acquireControlSession();
pollStatus(); setInterval(pollStatus, 1000);
pollTelemetry(); setInterval(pollTelemetry, 2000);
pickCameraSource(); setInterval(pickCameraSource, 5000);
pollDetections();
loadOperators(); refreshMission(); setInterval(refreshMission, 3000);
loadActions();
connectSocket();
fetch("/api/v1/llm/task").then((r) => (r.ok ? r.json() : null)).then((t) => { if (t) { state.llmTask = t; syncFinding(); markDirty("brain"); if (t.state === "running") pollLlm(); } }).catch(() => {});
document.getElementById("stop-finding").addEventListener("click", stopFinding);
syncFinding();
document.getElementById("reset-layout").addEventListener("click", resetLayout);
const talkBtn = document.getElementById("talk");
talkBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); startTalking(); });
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) talkBtn.addEventListener(ev, stopTalking);
addEventListener("keydown", (e) => { if (e.key.toLowerCase() === "v" && !e.repeat && document.activeElement?.tagName !== "INPUT") startTalking(); });
addEventListener("keyup", (e) => { if (e.key.toLowerCase() === "v") stopTalking(); });
window.__barry = { state, panels, renderer, scene, camera, controllers, teleopTick, updateControllers, clientLog, startGrab, resetLayout, screenRoot, sendClip, voice, pressTarget, releaseTarget, pulseHaptic, pulseAllHaptics, updateVoiceLevel, setupVoiceAnalyser, applyTelemetry, cycleCameraZoom, cycleCameraFilter, ZOOM_LEVELS, FILTER_PRESETS };
</script>
</body>
