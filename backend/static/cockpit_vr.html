<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BARRY // 3D Holographic VR Cockpit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050814;
            color: #d9e6f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #desktop-ui {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
            pointer-events: none;
        }
        .hud-badge {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
        }
        #switch-flatscreen {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        #switch-flatscreen:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00f0ff;
        }
        #command-status {
            position: absolute;
            top: 64px;
            left: 20px;
            z-index: 10;
            max-width: min(560px, calc(100vw - 40px));
            padding: 8px 12px;
            color: #fff;
            background: rgba(10, 16, 28, 0.92);
            border: 1px solid rgba(0, 240, 255, 0.45);
            border-radius: 6px;
            font: 700 0.8rem monospace;
            pointer-events: none;
        }
        #mission-controls {
            position: absolute;
            top: 106px;
            right: 20px;
            z-index: 10;
            width: min(360px, calc(100vw - 40px));
            padding: 12px;
            color: #d9e6f2;
            background: rgba(10, 16, 28, 0.94);
            border: 1px solid rgba(0, 240, 255, 0.45);
            border-radius: 8px;
            font: 13px monospace;
        }
        #mission-controls .mission-topline { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
        #mission-chip { color: #fbbf24; font-weight: 700; }
        #mission-controls .mission-fields { display: grid; grid-template-columns: 1fr 110px; gap: 8px; margin-bottom: 10px; }
        #mission-controls label { display: grid; gap: 4px; color: #94a3b8; }
        #mission-controls select, #mission-controls input, #mission-controls button {
            min-width: 0; padding: 7px 8px; color: #fff; background: #111c2d;
            border: 1px solid rgba(148, 163, 184, 0.45); border-radius: 5px; font: inherit;
        }
        #mission-controls .mission-actions { display: flex; gap: 8px; }
        #mission-controls button { flex: 1; cursor: pointer; font-weight: 700; }
        #mission-start-btn { border-color: #00c987 !important; }
        #mission-end-btn { border-color: #ff6b6b !important; }
        #mission-feedback { min-height: 1.2em; margin-top: 7px; color: #94a3b8; }
        #keyboard-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            background: rgba(10, 16, 26, 0.8);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }
    </style>
    <!-- Three.js + WebXR VRButton (Self-Hosted for Offline/Hotspot Reliability) -->
    <script src="/static/js/three.min.js"></script>
    <script src="/static/js/VRButton.js"></script>
</head>
<body>
    <img id="vr-cam-feed" src="/api/camera/stream" crossOrigin="anonymous" style="display:none;" />
    <canvas id="webgl-canvas"></canvas>
    <div id="desktop-ui">
        <div class="hud-badge">BARRY // 3D HOLOGRAPHIC COCKPIT</div>
        <a id="switch-flatscreen" href="/cockpit">← 2D Flatscreen Mode</a>
        <button id="recenter-view-btn" type="button" style="pointer-events:auto; padding:5px 12px; color:#00f0ff; background:rgba(0,240,255,0.12); border:1px solid rgba(0,240,255,0.4); border-radius:6px; font-size:0.75rem; cursor:pointer;">⟲ Recenter View</button>
    </div>
    <div id="command-status" role="status" aria-live="polite">READY · Connected to BARRY</div>
    <section id="mission-controls" aria-label="Mission controls">
        <div class="mission-topline"><strong>MISSION</strong><span id="mission-chip">Checking status…</span></div>
        <div class="mission-fields">
            <label>Operator<select id="mission-operator" disabled><option>Loading operators…</option></select></label>
            <label>Zone<input id="mission-zone" value="Zone-A" maxlength="40"></label>
        </div>
        <div class="mission-actions">
            <button id="mission-start-btn" type="button">Start mission</button>
            <button id="mission-end-btn" type="button" disabled>End mission</button>
        </div>
        <div id="mission-feedback" role="status" aria-live="polite"></div>
    </section>
    <div id="keyboard-hint">
        🎮 <b>Controls:</b> VR Controller Thumbsticks · VR Laser Virtual Joystick · WASD / Arrows · Space for E-Stop · Press 'R' to Recenter
    </div>

    <script>
        // --- State Management ---
        const state = {
            robotConnected: true,
            robotMode: "remote",
            battery: 99,
            roll: 0.0,
            pitch: 0.0,
            yaw: 0.0,
            rttMs: 12,
            fps: 20,
            frameAgeMs: 45,
            intensity: "MEDIUM",
            speed: 0.6,
            lastCommand: "stop",
            commandStatus: "READY",
            commandMessage: "Connected to BARRY",
            commandResultColor: "#fbbf24",
            mission: null,
            missionStatusKnown: false,
            operators: [],
            operatorIndex: 0,
            zone: "Zone-A",
            endMissionConfirmUntil: 0,
            motionMissionBlocked: false,
            forward: 0.0,
            strafe: 0.0,
            turn: 0.0,
            eStopActive: false
        };
        const virtualJoystickAxes = { forward: 0, turn: 0 };

        let controlSessionId = null;
        let commandSequence = 0;
        let sessionRequest = null;

        function updateCommandStatus(status, message = "") {
            state.commandStatus = String(status || "UNKNOWN").toUpperCase();
            state.commandMessage = String(message || "");
            state.commandResultColor = commandStatusColor(state.commandStatus);
            const statusElement = document.getElementById("command-status");
            if (statusElement) {
                statusElement.textContent = [state.commandStatus, state.commandMessage].filter(Boolean).join(" · ");
                statusElement.style.borderColor = state.commandResultColor;
                statusElement.style.color = state.commandResultColor;
            }
            if (typeof drawLeftPanel === "function") drawLeftPanel();
        }

        function commandStatusColor(status) {
            if (status === "ACCEPTED") return "#00ff88";
            if (status === "MISSION_REQUIRED" || status === "BUSY") return "#fbbf24";
            if (status === "ESTOP_ACTIVE" || status === "OFFLINE" || status.startsWith("HTTP_")) return "#ff5c70";
            if (status === "INVALID") return "#fb923c";
            return "#00f0ff";
        }

        function commandResultStatus(payload, response) {
            const detail = String(payload?.detail || payload?.message || "");
            const refusal = detail.match(/^(MISSION_REQUIRED|BUSY|ESTOP_ACTIVE|OFFLINE|INVALID)\s*:/i);
            if (refusal) return refusal[1].toUpperCase();
            if (payload?.status && String(payload.status).toUpperCase() !== "REJECTED") return String(payload.status).toUpperCase();
            return response.ok ? "ACCEPTED" : `HTTP_${response.status}`;
        }

        function newCommandId() {
            if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
            return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        async function acquireControlSession() {
            if (sessionRequest) return sessionRequest;
            sessionRequest = (async () => {
                try {
                    const headers = {};
                    if (controlSessionId) headers["X-Control-Session"] = controlSessionId;
                    const response = await fetch("/api/v1/session", { method: "POST", headers });
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok || !payload.session_id) {
                        return true;
                    }
                    controlSessionId = payload.session_id;
                    commandSequence = 0;
                    updateCommandStatus("SESSION_ACTIVE", "Control link active");
                    return true;
                } catch (error) {
                    return true;
                } finally {
                    sessionRequest = null;
                }
            })();
            return sessionRequest;
        }

        // Acquire a control session on startup. There is deliberately NO periodic re-acquire:
        // POST /api/v1/session always issues a NEW session and drops the previous one (single
        // operator, last caller wins), so a timer would steal control from other clients. The
        // session stays alive while commands flow (each one extends it by 10 s); after an idle
        // gap the first sequenced command gets a stale-session 409 and is re-acquired + retried
        // once in sendApiCommand below.
        acquireControlSession();

        function isStaleSessionRefusal(response, payload) {
            return response.status === 409 && /control session|sequence/i.test(String(payload?.detail || ""));
        }

        async function sendApiCommand(path, { body = null, sequenced = false, source = "hand", shouldSend = null, retried = false } = {}) {
            if (sequenced && !controlSessionId) {
                await acquireControlSession();
            }
            if (shouldSend && !shouldSend()) return null;
            if (path === "/api/v1/motion" && state.eStopActive) {
                updateCommandStatus("ESTOP_ACTIVE", "Reset the emergency stop before moving");
                return null;
            }

            const headers = { "X-Command-Source": source, "X-Command-Id": newCommandId() };
            if (body !== null) headers["Content-Type"] = "application/json";
            if (sequenced && controlSessionId) {
                headers["X-Control-Session"] = controlSessionId;
                headers["X-Command-Seq"] = String(++commandSequence);
                headers["X-Command-Sent-At"] = String(Date.now());
            }
            try {
                const response = await fetch(path, {
                    method: "POST",
                    headers,
                    body: body === null ? undefined : JSON.stringify(body)
                });
                const payload = await response.json().catch(() => ({}));
                if (sequenced && !retried && isStaleSessionRefusal(response, payload)) {
                    // Session expired after an idle gap (or another client took it): get a fresh
                    // one and retry this command ONCE, but only if it is still current (the stick
                    // is still deflected / not superseded by a stop). Never retry blindly.
                    controlSessionId = null;
                    await acquireControlSession();
                    if (controlSessionId && (!shouldSend || shouldSend())) {
                        return sendApiCommand(path, { body, sequenced, source, shouldSend, retried: true });
                    }
                }
                const resultStatus = commandResultStatus(payload, response);
                const detailMessage = String(payload.detail || payload.message || "").replace(/^(MISSION_REQUIRED|BUSY|ESTOP_ACTIVE|OFFLINE|INVALID)\s*:\s*/i, "");
                const message = resultStatus === "MISSION_REQUIRED"
                    ? `Start a mission to drive${detailMessage ? `. ${detailMessage}` : "."}`
                    : (detailMessage || (response.ok ? "Command accepted" : response.statusText));
                updateCommandStatus(resultStatus, message);
                if (resultStatus === "MISSION_REQUIRED") {
                    state.motionMissionBlocked = true;
                    motionGeneration++;
                    pendingMotion = null;
                    virtualJoystickOwner = null;
                    virtualJoystickAxes.forward = 0;
                    virtualJoystickAxes.turn = 0;
                    virtualJoystickHasSentMotion = false;
                    state.forward = state.strafe = state.turn = 0;
                    drawLeftPanel();
                }
                if (resultStatus === "ESTOP_ACTIVE") state.eStopActive = true;
                return { response, payload };
            } catch (error) {
                updateCommandStatus("OFFLINE", error.message || "Backend unreachable");
                return null;
            }
        }

        // --- Three.js Setup ---
        const canvas = document.getElementById("webgl-canvas");
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050814);
        scene.fog = new THREE.FogExp2(0x050814, 0.015);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0); // Eye level matching Barry.exe Eye = 1.6f

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.xr.enabled = true;
        renderer.xr.setReferenceSpaceType('local-floor');

        // Add WebXR button to enter immersive VR on Quest 3S
        const vrButton = VRButton.createButton(renderer);
        vrButton.style.zIndex = "100";
        vrButton.style.bottom = "20px";
        vrButton.style.right = "20px";
        document.body.appendChild(vrButton);

        // Ambient & Directional Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xa5b4fc, 0.6);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        // --- Environment: Starfield ---
        const starsCount = 2500;
        const starGeo = new THREE.BufferGeometry();
        const starCoords = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starCoords[i] = (Math.random() - 0.5) * 400;
            starCoords[i + 1] = Math.random() * 200; // Sky dome
            starCoords[i + 2] = (Math.random() - 0.5) * 400;
        }
        starGeo.setAttribute("position", new THREE.BufferAttribute(starCoords, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.85 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // --- Environment: Stylized Purple Saturn Planet with Rings ---
        const planetGroup = new THREE.Group();
        planetGroup.position.set(22, 14, -45); // Upper right sky as in teammate screenshot
        const planetGeo = new THREE.SphereGeometry(6, 32, 32);
        const planetMat = new THREE.MeshLambertMaterial({
            color: 0x6d28d9, // Vibrant purple
            emissive: 0x3b0764,
            emissiveIntensity: 0.4
        });
        const planetMesh = new THREE.Mesh(planetGeo, planetMat);
        planetGroup.add(planetMesh);

        // Saturn Rings
        const ringGeo = new THREE.RingGeometry(7.8, 12.5, 64);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0xc4b5fd,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.75
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2.5;
        ringMesh.rotation.y = Math.PI / 6;
        planetGroup.add(ringMesh);
        scene.add(planetGroup);

        // --- Environment: Retro Cyan Perspective Grid Floor ---
        const gridHelper = new THREE.GridHelper(160, 80, 0x00f0ff, 0x1e3a5f);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // Subtle dark plane under grid to block stars beneath floor
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x050814 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.position.y = -0.02;
        scene.add(floorMesh);
        // Holographic Cockpit Canopy Ribs (Framing the pilot space)
        const ribMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.28 });
        [-1, 1].forEach(side => {
            const curve = new THREE.EllipseCurve(side * 1.5, 1.6, 1.4, 1.6, 0, Math.PI, false, 0);
            const pts = curve.getPoints(40);
            const ribGeo = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p.x, p.y, -2.05)));
            scene.add(new THREE.Line(ribGeo, ribMat));
        });

        // --- Interactive Holographic Panels ---
        function createHoloPanel(w, h, canvasWidth, canvasHeight, pos, rotY = 0, rotX = 0) {
            const offscreenCanvas = document.createElement("canvas");
            offscreenCanvas.width = canvasWidth;
            offscreenCanvas.height = canvasHeight;
            const ctx = offscreenCanvas.getContext("2d");

            const texture = new THREE.CanvasTexture(offscreenCanvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            const geo = new THREE.PlaneGeometry(w, h);
            const mat = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            mesh.rotation.y = rotY;
            if (rotX !== 0) mesh.rotation.x = rotX;
            scene.add(mesh);

            return { canvas: offscreenCanvas, ctx, texture, mesh };
        }

        // Barry.exe Spatial Layout & Ergonomics Constants (Unity DashboardSceneBuilder.cs)
        const EYE_LEVEL = 1.60;                      // Pilot eye height (1.6m)
        const SIDE_PANEL_YAW = 36 * Math.PI / 180;   // 36° curved arc (0.6283 rad)
        const SIDE_PANEL_DIST = 1.30;                // 1.30m viewing distance
        const leftArcX = -Math.sin(SIDE_PANEL_YAW) * SIDE_PANEL_DIST; // -0.764m
        const leftArcZ = -Math.cos(SIDE_PANEL_YAW) * SIDE_PANEL_DIST; // -1.052m
        const rightArcX = Math.sin(SIDE_PANEL_YAW) * SIDE_PANEL_DIST; // +0.764m
        const rightArcZ = -Math.cos(SIDE_PANEL_YAW) * SIDE_PANEL_DIST; // -1.052m

        // Desk / Control Strip: 25° below eye level, 0.9m distance, tilted 15° up towards pilot
        const deskAngle = 25 * Math.PI / 180;
        const deskY = EYE_LEVEL - 0.90 * Math.sin(deskAngle); // 1.22m
        const deskZ = -0.90 * Math.cos(deskAngle);           // -0.816m
        const deskTiltX = -15 * Math.PI / 180;              // -0.2618 rad

        // 1. LEFT PANEL: STATUS, TELEMETRY & COMMAND SENT (Placed on -36° arc at 1.3m)
        const leftPanel = createHoloPanel(
            0.92, 1.09, 540, 640,
            new THREE.Vector3(leftArcX, EYE_LEVEL, leftArcZ),
            SIDE_PANEL_YAW, 0 // Angled +36° inward facing pilot
        );

        // MISSION PANEL: Start Mission Card floating in front (pos = 0, Eye - 0.22, 1.35)
        const missionPanel = createHoloPanel(
            1.05, 0.55, 600, 314,
            new THREE.Vector3(0, EYE_LEVEL - 0.22, -1.35),
            0, 0
        );

        // FLOATING 3D HEADER STRIP (pos = 0, Eye + 0.588, 2.0; directly above camera screen)
        const headerPanel = createHoloPanel(
            1.80, 0.15, 1000, 82,
            new THREE.Vector3(0, EYE_LEVEL + 0.588, -2.0),
            0, 0
        );

        // LATCHED EMERGENCY BANNER (pos = 0, Eye + 0.12, 1.6; shown only when E-STOP active)
        const emergencyBanner = createHoloPanel(
            1.20, 0.45, 720, 270,
            new THREE.Vector3(0, EYE_LEVEL + 0.12, -1.60),
            0, 0
        );
        emergencyBanner.mesh.visible = false;

        function drawLeftPanel() {
            const { ctx, canvas: c, texture } = leftPanel;
            ctx.clearRect(0, 0, c.width, c.height);

            // Translucent rounded panel with glowing border
            ctx.fillStyle = "rgba(10, 16, 28, 0.88)";
            ctx.strokeStyle = "rgba(220, 230, 255, 0.9)";
            ctx.lineWidth = 3;
            roundRect(ctx, 4, 4, c.width - 8, c.height - 8, 16, true, true);

            // STATUS Header
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px -apple-system, monospace";
            ctx.fillText("STATUS", 32, 48);

            // Status Metrics Grid
            ctx.fillStyle = "#94a3b8";
            ctx.font = "18px -apple-system, monospace";
            ctx.fillText("Robot", 32, 90);
            ctx.fillText("Control", 280, 90);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText(state.robotConnected ? "ONLINE" : "--", 32, 118);
            ctx.fillText(state.robotMode.toUpperCase(), 280, 118);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "18px -apple-system, monospace";
            ctx.fillText("Camera", 32, 160);
            ctx.fillText("Backend RTT", 280, 160);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText(state.robotConnected ? "READY" : "--", 32, 188);
            ctx.fillText(state.rttMs === null ? "-- ms" : `${state.rttMs} ms`, 280, 188);
            // Battery
            ctx.fillStyle = "#94a3b8";
            ctx.font = "18px -apple-system, monospace";
            ctx.fillText("Battery", 32, 230);
            ctx.fillStyle = state.battery > 20 ? "#00ff88" : "#ff2a4b";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText(state.battery > 0 ? `${Math.round(state.battery)} %` : "-- %", 460, 230);

            // Battery bar
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            roundRect(ctx, 32, 246, c.width - 64, 10, 5, true, false);
            if (state.battery > 0) {
                ctx.fillStyle = state.battery > 20 ? "#00ff88" : "#ff2a4b";
                roundRect(ctx, 32, 246, Math.max(10, ((c.width - 64) * state.battery) / 100), 10, 5, true, false);
            }

            // Divider Line
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(32, 290);
            ctx.lineTo(c.width - 32, 290);
            ctx.stroke();

            // Virtual VR joystick. The controller laser moves the knob while its
            // trigger is held; a neutral stick sends an explicit stop.
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText("VR JOYSTICK", 32, 335);
            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px -apple-system, monospace";
            ctx.fillText("AIM LASER · HOLD TRIGGER · RELEASE TO STOP", 32, 360);

            const stickX = 170;
            const stickY = 480;
            const stickRadius = 92;
            ctx.fillStyle = "rgba(0, 240, 255, 0.08)";
            ctx.strokeStyle = "rgba(0, 240, 255, 0.75)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(stickX, stickY, stickRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(stickX - stickRadius, stickY);
            ctx.lineTo(stickX + stickRadius, stickY);
            ctx.moveTo(stickX, stickY - stickRadius);
            ctx.lineTo(stickX, stickY + stickRadius);
            ctx.stroke();

            const knobX = stickX - virtualJoystickAxes.turn * stickRadius;
            const knobY = stickY - virtualJoystickAxes.forward * stickRadius;
            ctx.fillStyle = "rgba(0, 240, 255, 0.75)";
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(knobX, knobY, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#cbd5e1";
            ctx.font = "bold 13px -apple-system, monospace";
            ctx.textAlign = "center";
            ctx.fillText("FORWARD", stickX, stickY - stickRadius - 12);
            ctx.fillText("BACK", stickX, stickY + stickRadius + 21);
            ctx.fillText("TURN LEFT", stickX - stickRadius - 35, stickY + 5);
            ctx.fillText("TURN RIGHT", stickX + stickRadius + 38, stickY + 5);
            ctx.textAlign = "left";

            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px -apple-system, monospace";
            ctx.fillText(`FORWARD  ${state.forward.toFixed(2)}`, 320, 430);
            ctx.fillText(`STRAFE   ${state.strafe.toFixed(2)}`, 320, 462);

            ctx.strokeStyle = enabled ? color : "rgba(148,163,184,0.28)";
            ctx.lineWidth = 1.5;
            roundRect(ctx, x, y, w, h, 7, true, true);

            ctx.font = "bold 14px monospace";
            ctx.textAlign = "center";
            ctx.fillText(label, x + w / 2, y + h / 2 + 5, w - 12);
            ctx.textAlign = "left";
        }

        function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
            const words = String(text || "").split(/\s+/);
            let line = "";
            let lineNumber = 0;
            for (const word of words) {
                const candidate = line ? `${line} ${word}` : word;
                if (line && ctx.measureText(candidate).width > maxWidth) {
                    ctx.fillText(line, x, y + lineNumber * lineHeight, maxWidth);
                    line = word;
                    lineNumber++;
                    if (lineNumber >= maxLines) break;
                } else {
                    line = candidate;
                }
            }
            if (line && lineNumber < maxLines) ctx.fillText(line, x, y + lineNumber * lineHeight, maxWidth);
        }

        function syncMissionControls() {
            const chip = document.getElementById("mission-chip");
            const startButton = document.getElementById("mission-start-btn");
            const endButton = document.getElementById("mission-end-btn");
            const operatorSelect = document.getElementById("mission-operator");
            const zoneInput = document.getElementById("mission-zone");
            const feedback = document.getElementById("mission-feedback");
            const active = Boolean(state.mission?.active);

            if (chip) {
                chip.textContent = active
                    ? `ACTIVE · ${state.mission.operator_name || state.mission.operator_id} · ${state.mission.zone}`
                    : (state.missionStatusKnown ? "NO ACTIVE MISSION" : "Checking status…");
                chip.style.color = active ? "#00ff88" : "#fbbf24";
            }
            if (startButton) startButton.disabled = active || !state.operators.length;
            if (endButton) {
                endButton.disabled = !active;
                endButton.textContent = Date.now() < state.endMissionConfirmUntil ? "Confirm end mission" : "End mission";
            }
            if (operatorSelect && state.operators.length) {
                operatorSelect.value = state.operators[state.operatorIndex]?.operator_id || "";
                operatorSelect.disabled = active;
            }
            if (zoneInput) {
                zoneInput.value = state.zone;
                zoneInput.disabled = active;
            }
            if (feedback && state.missionFeedback) feedback.textContent = state.missionFeedback;
            if (typeof drawMissionPanel === "function" && typeof missionPanel !== "undefined") drawMissionPanel();
            if (typeof drawHeaderPanel === "function" && typeof headerPanel !== "undefined") drawHeaderPanel();
            if (typeof drawBottomPanel === "function" && typeof bottomPanel !== "undefined") drawBottomPanel();
        }

        async function loadMissionOperators() {
            const select = document.getElementById("mission-operator");
            try {
                const response = await fetch("/api/operators");
                const payload = await response.json().catch(() => []);
                if (!response.ok || !Array.isArray(payload)) throw new Error(payload.detail || `HTTP ${response.status}`);
                state.operators = payload;
                const selectedMissionOperator = state.mission?.operator_id;
                const selectedIndex = state.operators.findIndex((operator) => operator.operator_id === selectedMissionOperator);
                state.operatorIndex = selectedIndex >= 0 ? selectedIndex : 0;
                if (select) {
                    select.replaceChildren();
                    state.operators.forEach((operator) => {
                        const option = document.createElement("option");
                        option.value = operator.operator_id;
                        option.textContent = `${operator.name} (${operator.role})`;
                        select.appendChild(option);
                    });
                    select.disabled = !state.operators.length || Boolean(state.mission?.active);
                }
                state.missionFeedback = state.operators.length ? "" : "No operators are registered.";
            } catch (error) {
                state.missionFeedback = `Could not load operators: ${error.message}`;
                if (select) {
                    select.replaceChildren(new Option("Operators unavailable", ""));
                    select.disabled = true;
                }
            }
            syncMissionControls();
        }

        function applyMissionStatus(mission) {
            state.mission = mission && typeof mission === "object" ? mission : { active: false };
            state.missionStatusKnown = true;
            // Hand/joystick motion is always allowed without an active mission; only voice/LLM require a mission.
            state.motionMissionBlocked = false;
            if (state.mission.active && state.commandStatus === "MISSION_REQUIRED") {
                updateCommandStatus("READY", "Mission active; ready to drive");
            }
            syncMissionControls();
        }

        async function refreshMissionStatus() {
            try {
                const response = await fetch("/api/mission/status");
                const mission = await response.json().catch(() => ({}));
                if (response.ok) applyMissionStatus(mission);
            } catch (error) {
                // Keep the last known mission state; command requests still report OFFLINE if needed.
            }
        }

        async function startMission() {
            const operator = state.operators[state.operatorIndex];
            const zone = String(document.getElementById("mission-zone")?.value || state.zone).trim();
            if (!operator || !zone) {
                state.missionFeedback = "Choose an operator and enter a zone.";
                syncMissionControls();
                return;
            }
            state.zone = zone;
            state.missionFeedback = "Starting mission…";
            syncMissionControls();
            try {
                const response = await fetch("/api/mission/start", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ operator_id: operator.operator_id, zone })
                });
                const mission = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(mission.detail || `HTTP ${response.status}`);
                applyMissionStatus(mission);
                state.missionFeedback = `Mission started for ${mission.operator_name || operator.name}.`;
            } catch (error) {
                state.missionFeedback = `Mission start failed: ${error.message}`;
            }
            syncMissionControls();
        }

        async function endMission() {
            if (Date.now() >= state.endMissionConfirmUntil) {
                state.endMissionConfirmUntil = Date.now() + 5000;
                state.missionFeedback = "Select End mission again within 5 seconds to confirm.";
                syncMissionControls();
                setTimeout(() => {
                    if (Date.now() >= state.endMissionConfirmUntil) {
                        state.endMissionConfirmUntil = 0;
                        syncMissionControls();
                    }
                }, 5100);
                return;
            }
            state.endMissionConfirmUntil = 0;
            state.missionFeedback = "Ending mission…";
            syncMissionControls();
            try {
                const response = await fetch("/api/mission/stop", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ reason: "Operator ended mission" })
                });
                const mission = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(mission.detail || `HTTP ${response.status}`);
                applyMissionStatus(mission);
                state.missionFeedback = "Mission ended. Start a mission to drive again.";
                updateCommandStatus("MISSION_REQUIRED", "Start a mission to drive");
            } catch (error) {
                state.missionFeedback = `Mission end failed: ${error.message}`;
            }
            syncMissionControls();
        }

            ctx.lineTo(c.width - 32, 88);
            ctx.stroke();

            // POSTURES Title
            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 16px -apple-system, monospace";
            ctx.fillText("QUICK POSTURE PRESETS", 32, 118);

            // Posture Tiles: 2 columns x 3 rows
            const postures = [
                { label: "STAND", id: "stand" },
                { label: "SIT", id: "sit" },
                { label: "LIE DOWN", id: "liedown" },
                { label: "BOW", id: "bow" },

            ];

            const tileW = 224;

            const startY = 136;

            postures.forEach((p, idx) => {

                ctx.strokeStyle = isActive ? "#a5b4fc" : "rgba(255, 255, 255, 0.2)";
                ctx.lineWidth = 1.5;
                roundRect(ctx, tx, ty, tileW, tileH, 10, true, true);

                ctx.fillStyle = isActive ? "#ffffff" : "#d9e6f2";
                ctx.font = "bold 15px -apple-system, monospace";
                ctx.textAlign = "center";
                ctx.fillText(p.label, tx + tileW / 2, ty + 31);
                ctx.textAlign = "left";
            });

            // GAIT & MOTION Title
            const gaitY = startY + 3 * (tileH + gapY) + 20;
            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 16px -apple-system, monospace";
            ctx.fillText("GAIT & LOCOMOTION MODES", 32, gaitY);

            // Gait Buttons: Trot, Crawl
            const gaits = [
                { label: "TROT GAIT (Agile)", id: "trot" },
                { label: "CRAWL GAIT (Stable)", id: "crawl" }
            ];
            gaits.forEach((g, idx) => {
                const tx = startX + idx * (tileW + gapX);
                const ty = gaitY + 16;
                ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
                ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
                ctx.lineWidth = 1.5;
                roundRect(ctx, tx, ty, tileW, tileH, 10, true, true);

                ctx.fillStyle = "#d9e6f2";
                ctx.font = "bold 14px -apple-system, monospace";
                ctx.textAlign = "center";
                ctx.fillText(g.label, tx + tileW / 2, ty + 31);
                ctx.textAlign = "left";
            });

            // AI & VISION Title
            const aiY = gaitY + tileH + 34;
            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 16px -apple-system, monospace";
            ctx.fillText("INTELLIGENCE & SENSORS", 32, aiY);

            // AI Action Buttons
            const aiActions = [
                { label: "AI VISION SCAN", id: "ai_scan" },
                { label: "ZERO IMU HEADING", id: "zero_imu" }
            ];
            aiActions.forEach((a, idx) => {
                const tx = startX + idx * (tileW + gapX);
                const ty = aiY + 16;
                ctx.fillStyle = "rgba(16, 185, 129, 0.15)";
                ctx.strokeStyle = "rgba(16, 185, 129, 0.4)";
                ctx.lineWidth = 1.5;
                roundRect(ctx, tx, ty, tileW, tileH, 10, true, true);

                ctx.fillStyle = "#34d399";
                ctx.font = "bold 14px -apple-system, monospace";
                ctx.textAlign = "center";
                ctx.fillText(a.label, tx + tileW / 2, ty + 31);
                ctx.textAlign = "left";
            });

            // Footer info
            ctx.fillStyle = "#6366f1";
            ctx.beginPath();
            ctx.arc(42, 608, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px -apple-system, monospace";
            ctx.fillText("Point VR laser or mouse click to command", 58, 613);

            texture.needsUpdate = true;
        }

        // --- Helper: Canvas Rounded Rectangle ---
        function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }

        // Render initial panel graphics
        drawLeftPanel();
        drawCenterPanel();
        drawBottomPanel();
        drawRightPanel();
        drawMissionPanel();
        drawHeaderPanel();
        drawEmergencyBanner();

        // --- Interaction: Raycasting & Click Handling ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const virtualStickCenter = { x: 170, y: 480, radius: 92 };
        let virtualJoystickOwner = null;
        let virtualJoystickLastSentAt = 0;
        let virtualJoystickHasSentMotion = false;

        function virtualStickHit(ray) {
            const hit = ray.intersectObject(leftPanel.mesh)[0];
            if (!hit || !hit.uv) return null;
            const x = hit.uv.x * leftPanel.canvas.width;
            const y = (1 - hit.uv.y) * leftPanel.canvas.height;
            return { hit, x, y };
        }

        function updateVirtualStickFromHit(pointer, requireOnPad = false) {
            if (!pointer) {
                virtualJoystickAxes.forward = 0;
                virtualJoystickAxes.turn = 0;
                drawLeftPanel();
                return;
            }
            let dx = (pointer.x - virtualStickCenter.x) / virtualStickCenter.radius;
            let dy = (virtualStickCenter.y - pointer.y) / virtualStickCenter.radius;
            const length = Math.hypot(dx, dy);
            if (requireOnPad && length > 1.35) return false;
            if (length > 1) {
                dx /= length;
                dy /= length;
            }
            if (Math.abs(dx) < 0.12) dx = 0;
            if (Math.abs(dy) < 0.12) dy = 0;
            // Screen-right turns the robot right; positive MotionCommand.turn is left.
            virtualJoystickAxes.turn = -dx;
            virtualJoystickAxes.forward = dy;
            drawLeftPanel();
            return true;
        }

        function setVirtualJoystickOwner(owner, pointer) {
            if (virtualJoystickOwner || !updateVirtualStickFromHit(pointer, true)) return false;
            virtualJoystickOwner = owner;
            virtualJoystickLastSentAt = 0;
            return true;
        }

        function releaseVirtualJoystick(owner) {
            if (virtualJoystickOwner !== owner) return;
            virtualJoystickOwner = null;
            virtualJoystickAxes.forward = 0;
            virtualJoystickAxes.turn = 0;
            virtualJoystickLastSentAt = performance.now();
            const hadMotion = virtualJoystickHasSentMotion;
            virtualJoystickHasSentMotion = false;
            drawLeftPanel();
            if (hadMotion) sendMotionAxes(0, 0, 0);
        }

        function updateVirtualJoystickControls() {
            if (!virtualJoystickOwner) return;
            if (state.eStopActive) {
                virtualJoystickOwner = null;
                virtualJoystickAxes.forward = 0;
                virtualJoystickAxes.turn = 0;
                virtualJoystickHasSentMotion = false;
                drawLeftPanel();
                return;
            }
            if (virtualJoystickOwner !== "mouse") {
                const controller = virtualJoystickOwner;
                const tempMatrix = new THREE.Matrix4();
                tempMatrix.identity().extractRotation(controller.matrixWorld);
                raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
                updateVirtualStickFromHit(virtualStickHit(raycaster));
            }

            const now = performance.now();
            const moving = Math.abs(virtualJoystickAxes.forward) > 0 || Math.abs(virtualJoystickAxes.turn) > 0;
            if (now - virtualJoystickLastSentAt >= 120 && (moving || virtualJoystickHasSentMotion)) {
                sendMotionAxes(
                    virtualJoystickAxes.forward * state.speed,
                    0,
                    virtualJoystickAxes.turn * state.speed
                );
                virtualJoystickHasSentMotion = moving;
                virtualJoystickLastSentAt = now;
            }
        }

        // --- Hardware VR Controller Thumbstick Poller (Quest Touch / Touch Plus) ---
        let xrWasDeflected = false;
        let xrLastSentAt = 0;

        function updateXrControllerThumbsticks() {
            if (!renderer.xr.isPresenting) return;
            const session = renderer.xr.getSession();
            if (!session || !session.inputSources) return;

            let fwd = 0;
            let strafe = 0;
            let turn = 0;
            let eStopPressed = false;

            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const gp = source.gamepad;
                const axes = gp.axes;
                const buttons = gp.buttons;

                // Stop button check: A button on right controller (index 4) or thumbstick press (index 3)
                if (buttons) {
                    if (source.handedness === 'right') {
                        if ((buttons[4] && buttons[4].pressed) || (buttons[3] && buttons[3].pressed)) {
                            eStopPressed = true;
                        }
                    }
                }

                if (axes && axes.length >= 4) {
                    // Standard WebXR Gamepad mapping:
                    // axes[2]: thumbstick X (-1 left, +1 right)
                    // axes[3]: thumbstick Y (-1 up/forward, +1 down/backward)
                    if (source.handedness === 'left') {
                        const ax = axes[2];
                        const ay = axes[3];
                        if (Math.abs(ay) > 0.12) fwd -= ay;      // pushing stick up is negative Y -> forward
                        if (Math.abs(ax) > 0.12) strafe -= ax;   // pushing stick left -> strafe left
                    } else if (source.handedness === 'right') {
                        const ax = axes[2];
                        if (Math.abs(ax) > 0.12) turn -= ax;     // pushing stick left -> turn left
                    }
                }
            }

            if (eStopPressed && !state.eStopActive) {
                triggerEmergencyStop();
                return;
            }

            fwd = Math.max(-1, Math.min(1, fwd));
            strafe = Math.max(-1, Math.min(1, strafe));
            turn = Math.max(-1, Math.min(1, turn));

            const isDeflected = Math.abs(fwd) > 0.05 || Math.abs(strafe) > 0.05 || Math.abs(turn) > 0.05;
            const now = performance.now();

            if (isDeflected) {
                state.cmdFwd = fwd;
                state.cmdStrafe = strafe;
                state.cmdTurn = turn;
                if (now - xrLastSentAt >= 100) {
                    xrLastSentAt = now;
                    sendMotionAxes(fwd * state.speed, strafe * state.speed, turn * state.speed);
                }
                xrWasDeflected = true;
            } else if (xrWasDeflected) {
                xrWasDeflected = false;
                state.cmdFwd = 0;
                state.cmdStrafe = 0;
                state.cmdTurn = 0;
                sendMotionAxes(0, 0, 0);
            }
        }

        async function handleBottomPanelClick(uvX, uvY) {
            const x = uvX * bottomPanel.canvas.width;
            const y = (1 - uvY) * bottomPanel.canvas.height;

            // Intensity Buttons: y: 45 to 115
            if (y >= 45 && y <= 115) {
                if (x >= 24 && x <= 100) {
                    state.intensity = 'LOW';
                    state.speed = 0.3;
                    playChime(600, 0.05);
                    drawBottomPanel();
                } else if (x >= 106 && x <= 202) {
                    state.intensity = 'MEDIUM';
                    state.speed = 0.6;
                    playChime(700, 0.05);
                    drawBottomPanel();
                } else if (x >= 208 && x <= 288) {
                    state.intensity = 'HIGH';
                    state.speed = 1.0;
                    playChime(850, 0.05);
                    drawBottomPanel();
                }
            }

            // Stop button: x: 310 to 540, y: 26 to 114
            if (x >= 310 && x <= 540 && y >= 26 && y <= 114) {
                if (state.eStopActive) await resetEmergencyStop();
                else await stopRobot();
            }

            const activeMission = Boolean(state.mission?.active);
            if (activeMission) {
                // End mission button: x: 556 to 676, y: 40 to 98
                if (x >= 556 && x <= 676 && y >= 40 && y <= 98) {
                    await endMission();
                }
                // Exit VR button: x: 690 to 785, y: 40 to 98
                if (x >= 690 && x <= 785 && y >= 40 && y <= 98) {
                    const session = renderer.xr.getSession();
                    if (session) session.end();
                }
            } else {
                // Exit VR button: x: 570 to 750, y: 40 to 98
                if (x >= 570 && x <= 750 && y >= 40 && y <= 98) {
                    const session = renderer.xr.getSession();
                    if (session) session.end();
                }
            }
        }

        async function handleMissionPanelClick(uvX, uvY) {
            const x = uvX * missionPanel.canvas.width;
            const y = (1 - uvY) * missionPanel.canvas.height;

            // Operator prev/next: y: 100 to 155
            if (y >= 100 && y <= 155) {
                if (x >= 24 && x <= 74 && state.operators.length && !state.mission?.active) {
                    state.operatorIndex = (state.operatorIndex - 1 + state.operators.length) % state.operators.length;
                    syncMissionControls();
                } else if (x >= 526 && x <= 576 && state.operators.length && !state.mission?.active) {
                    state.operatorIndex = (state.operatorIndex + 1) % state.operators.length;
                    syncMissionControls();
                }
            }
            // Zone prev/next: y: 175 to 230
            else if (y >= 175 && y <= 230 && !state.mission?.active) {
                const current = missionZones.indexOf(state.zone);
                if (x >= 24 && x <= 74) state.zone = missionZones[(current - 1 + missionZones.length) % missionZones.length];
                else if (x >= 526 && x <= 576) state.zone = missionZones[(current + 1 + missionZones.length) % missionZones.length];
                syncMissionControls();
            }
            // Start mission: x: 175 to 425, y: 235 to 300
            else if (y >= 235 && y <= 300) {
                if (x >= 175 && x <= 425 && !state.mission?.active) await startMission();
            }
        }

        async function handleEmergencyBannerClick(uvX, uvY) {
            const x = uvX * emergencyBanner.canvas.width;
            const y = (1 - uvY) * emergencyBanner.canvas.height;
            // Reset button: x: 200 to 520, y: 160 to 250
            if (x >= 200 && x <= 520 && y >= 160 && y <= 250) {
                playChime(600, 0.08);
                await resetEmergencyStop();
            }
        }

        function handleHeaderPanelClick(uvX, uvY) {
            const x = uvX * headerPanel.canvas.width;
            // Clicking mission chip (x: 130 to 470) toggles mission panel
            if (x >= 130 && x <= 470) {
                missionPanel.mesh.visible = !missionPanel.mesh.visible;
                playChime(700, 0.05);
            }
        }

        async function handleRightPanelClick(uvX, uvY) {
            playChime(850, 0.08);
            let action = null;
            let posturePreset = null;

            if (uvX >= 0.05 && uvX <= 0.48) {
                if (uvY >= 0.70 && uvY <= 0.80) posturePreset = "stand";
                else if (uvY >= 0.60 && uvY <= 0.70) posturePreset = "liedown";
                else if (uvY >= 0.50 && uvY <= 0.60) posturePreset = "balance";
                else if (uvY >= 0.37 && uvY <= 0.47) action = "trot";
                else if (uvY >= 0.21 && uvY <= 0.31) action = "ai_scan";
            } else if (uvX >= 0.52 && uvX <= 0.95) {
                if (uvY >= 0.70 && uvY <= 0.80) posturePreset = "sit";
                else if (uvY >= 0.60 && uvY <= 0.70) posturePreset = "bow";
                else if (uvY >= 0.50 && uvY <= 0.60) posturePreset = "wave";
                else if (uvY >= 0.37 && uvY <= 0.47) action = "crawl";
                else if (uvY >= 0.21 && uvY <= 0.31) action = "zero_imu";
            }

            if (posturePreset) {
                state.lastCommand = posturePreset;
                drawRightPanel();
                const postureHeights = {
                    stand: "high", liedown: "low", balance: "medium",
                    sit: "low", bow: "medium", wave: "medium"
                };
                await sendApiCommand("/api/v1/posture", {
                    body: { height: postureHeights[posturePreset], roll: 0, pitch: 0, yaw: 0 },
                    sequenced: true
                });
            } else if (action) {
                if (action === "ai_scan") {
                    state.lastCommand = "ai_scan";
                    drawRightPanel();
                    try { await fetch('/api/v1/missions/scan', { method: 'POST' }); } catch(e) {}
                } else if (action === "zero_imu") {
                    state.roll = 0;
                    state.pitch = 0;
                    state.lastCommand = "zero_imu";
                    drawCenterPanel();
                    drawRightPanel();
                } else if (action === "trot" || action === "crawl") {
                    state.lastCommand = action;
                    drawRightPanel();
                    await sendApiCommand("/api/v1/movement-style", {
                        body: { intensity: state.intensity.toLowerCase(), gait: action === "crawl" ? "walk" : "trot" },
                        sequenced: true
                    });
                } else {
                    sendLocomotion(action);
                }
            }
        }

        function dispatchRaycastInteraction(ray) {
            const interactiveMeshes = [bottomPanel.mesh, rightPanel.mesh];
            if (headerPanel && headerPanel.mesh) interactiveMeshes.push(headerPanel.mesh);
            if (missionPanel && missionPanel.mesh.visible) interactiveMeshes.push(missionPanel.mesh);
            if (emergencyBanner && emergencyBanner.mesh.visible) interactiveMeshes.push(emergencyBanner.mesh);

            const hits = ray.intersectObjects(interactiveMeshes);
            if (hits.length > 0) {
                const hit = hits[0];
                const uv = hit.uv;
                if (hit.object === bottomPanel.mesh) {
                    handleBottomPanelClick(uv.x, uv.y);
                } else if (hit.object === rightPanel.mesh) {
                    handleRightPanelClick(uv.x, uv.y);
                } else if (hit.object === missionPanel.mesh) {
                    handleMissionPanelClick(uv.x, uv.y);
                } else if (hit.object === emergencyBanner.mesh) {
                    handleEmergencyBannerClick(uv.x, uv.y);
                } else if (hit.object === headerPanel.mesh) {
                    handleHeaderPanelClick(uv.x, uv.y);
                }
            }
        }

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            dispatchRaycastInteraction(raycaster);
        });

        // VR Controller Support with Visual Laser Pointers
        function buildLaserPointer() {
            const geo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -3.5)
            ]);
            const mat = new THREE.LineBasicMaterial({
                color: 0x00f0ff,
                transparent: true,
                opacity: 0.55
            });
            return new THREE.Line(geo, mat);
        }

        const controller1 = renderer.xr.getController(0);
        controller1.add(buildLaserPointer());
        scene.add(controller1);

        const controller2 = renderer.xr.getController(1);
        controller2.add(buildLaserPointer());
        scene.add(controller2);

        function setControllerRay(controller) {
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
        }

        function handleControllerSelectStart(controller) {
            setControllerRay(controller);
            const joystickPointer = virtualStickHit(raycaster);
            if (joystickPointer && setVirtualJoystickOwner(controller, joystickPointer)) return;
            dispatchRaycastInteraction(raycaster);
        }

        function handleControllerSelectEnd(controller) {
            releaseVirtualJoystick(controller);
        }

        controller1.addEventListener('selectstart', () => handleControllerSelectStart(controller1));
        controller2.addEventListener('selectstart', () => handleControllerSelectStart(controller2));
        controller1.addEventListener('selectend', () => handleControllerSelectEnd(controller1));
        controller2.addEventListener('selectend', () => handleControllerSelectEnd(controller2));
        renderer.xr.addEventListener('sessionend', () => {
            if (virtualJoystickOwner && virtualJoystickOwner !== "mouse") {
                releaseVirtualJoystick(virtualJoystickOwner);
            }
        });

        // Desktop 360 Drag Look Controls
        let isDragging = false;
        let prevMouseX = 0;
        let prevMouseY = 0;
        let camYaw = 0;
        let camPitch = 0;

        function recenterCamera() {
            camYaw = 0;
            camPitch = 0;
            camera.position.set(0, EYE_LEVEL, 0);
            camera.rotation.set(0, 0, 0, 'YXZ');
            playChime(900, 0.08);
            updateCommandStatus("VIEW_RESET", "View recentered");
        }
        document.getElementById("recenter-view-btn")?.addEventListener("click", recenterCamera);

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || (e.target.closest && e.target.closest('#desktop-ui'))) return;
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const joystickPointer = virtualStickHit(raycaster);
                if (joystickPointer && setVirtualJoystickOwner("mouse", joystickPointer)) {
                    e.preventDefault();
                    return;
                }
                isDragging = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (virtualJoystickOwner === "mouse") {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                updateVirtualStickFromHit(virtualStickHit(raycaster));
                return;
            }
            if (isDragging && !renderer.xr.isPresenting) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                camYaw -= dx * 0.003;
                camPitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, camPitch - dy * 0.003));
                camera.rotation.set(camPitch, camYaw, 0, 'YXZ');
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            releaseVirtualJoystick("mouse");
        });

        // --- Web Audio & Sound Feedback ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playChime(freq = 600, duration = 0.08) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // --- Gateway-backed, coalescing robot command dispatcher ---
        let isDispatching = false;
        let pendingMotion = null;
        let motionGeneration = 0;

        function sendLocomotion(action, speed = state.speed) {
            if (action === "stop") return stopRobot();
            const magnitude = Math.max(0, Math.min(1, Number(speed) || 0));
            const axes = { forward: 0, strafe: 0, turn: 0 };
            if (action === "forward") axes.forward = magnitude;
            else if (action === "backward") axes.forward = -magnitude;
            else if (action === "strafe_left") axes.strafe = magnitude;
            else if (action === "strafe_right") axes.strafe = -magnitude;
            else if (action === "turn_left") axes.turn = magnitude;
            else if (action === "turn_right") axes.turn = -magnitude;
            else {
                updateCommandStatus("INVALID", `Unsupported motion: ${action}`);
                return;
            }
            sendMotionAxes(axes.forward, axes.strafe, axes.turn);
        }

        function sendMotionAxes(forward, strafe, turn) {
            const command = {
                forward: Math.max(-1, Math.min(1, forward)),
                strafe: Math.max(-1, Math.min(1, strafe)),
                turn: Math.max(-1, Math.min(1, turn)),
                generation: motionGeneration
            };
            state.forward = command.forward;
            state.strafe = command.strafe;
            state.turn = command.turn;
            state.lastCommand = command.forward || command.strafe || command.turn ? "motion" : "stop";
            drawLeftPanel();

            const isStop = !command.forward && !command.strafe && !command.turn;
            if (isStop) return stopRobot();
            if (state.motionMissionBlocked) {
                updateCommandStatus("MISSION_REQUIRED", "Start a mission to drive");
                return;
            }
            if (state.eStopActive) {
                updateCommandStatus("ESTOP_ACTIVE", "Reset the emergency stop before moving");
                return;
            }
            pendingMotion = command;
            if (!isDispatching) void dispatchPendingMotion();
        }

        async function dispatchPendingMotion() {
            isDispatching = true;
            try {
                while (pendingMotion) {
                    const command = pendingMotion;
                    pendingMotion = null;
                    if (state.eStopActive || command.generation !== motionGeneration) continue;
                    const { generation, ...axes } = command;
                    await sendApiCommand("/api/v1/motion", {
                        body: axes,
                        sequenced: true,
                        shouldSend: () => generation === motionGeneration && !state.eStopActive
                    });
                }
            } finally {
                isDispatching = false;
                if (pendingMotion) void dispatchPendingMotion();
            }
        }

        async function stopRobot() {
            motionGeneration++;
            pendingMotion = null;
            state.forward = 0;
            state.strafe = 0;
            state.turn = 0;
            state.lastCommand = "stop";
            drawLeftPanel();
            return sendApiCommand("/api/v1/stop");
        }

        async function triggerEmergencyStop() {
            playChime(300, 0.25);
            motionGeneration++;
            pendingMotion = null;
            state.eStopActive = true;
            virtualJoystickOwner = null;
            virtualJoystickAxes.forward = 0;
            virtualJoystickAxes.turn = 0;
            virtualJoystickHasSentMotion = false;
            drawLeftPanel();
            drawBottomPanel();
            drawHeaderPanel();
            drawEmergencyBanner();
            return sendApiCommand("/api/v1/emergency-stop", { source: "emergency" });
        }

        async function resetEmergencyStop() {
            state.eStopActive = false;
            drawBottomPanel();
            drawHeaderPanel();
            drawEmergencyBanner();
            return sendApiCommand("/api/v1/emergency-stop/reset", { sequenced: true });
        }

        // --- Keyboard Controls (WASD / Arrows / Space) ---
        const activeKeys = new Set();
        let keyTeleopInterval = null;

        function updateKeyMovement() {
            const fwd = Number(activeKeys.has('w') || activeKeys.has('arrowup')) - Number(activeKeys.has('s') || activeKeys.has('arrowdown'));
            const strafe = Number(activeKeys.has('a')) - Number(activeKeys.has('d'));
            const turn = Number(activeKeys.has('arrowleft') || activeKeys.has('q')) - Number(activeKeys.has('arrowright') || activeKeys.has('e'));

            state.cmdFwd = fwd;
            state.cmdStrafe = strafe;
            state.cmdTurn = turn;
            drawLeftPanel();

            if (fwd !== 0 || strafe !== 0 || turn !== 0) {
                playChime(750, 0.04);
                sendMotionAxes(fwd * state.speed, strafe * state.speed, turn * state.speed);
            } else {
                sendMotionAxes(0, 0, 0);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const key = e.key.toLowerCase();
            if (key === 'r') {
                recenterCamera();
                return;
            }
            if (key === ' ') {
                e.preventDefault();
                triggerEmergencyStop();
                return;
            }
            if (['w', 's', 'a', 'd', 'q', 'e', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
                activeKeys.add(key);
                updateKeyMovement();
                if (!keyTeleopInterval) {
                    keyTeleopInterval = setInterval(updateKeyMovement, 120);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (activeKeys.has(key)) {
                activeKeys.delete(key);
                updateKeyMovement();
                if (activeKeys.size === 0 && keyTeleopInterval) {
                    clearInterval(keyTeleopInterval);
                    keyTeleopInterval = null;
                }
            }
        });

        // --- WebSocket Telemetry Loop ---
        function initWebSocket() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.onopen = () => {
                state.robotConnected = true;
                drawLeftPanel();
                drawCenterPanel();
                drawHeaderPanel();
            };
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'telemetry' && data.telemetry) {
                        const t = data.telemetry;
                        if (t.battery_pct !== undefined) state.battery = t.battery_pct;
                        if (t.roll !== undefined) state.roll = t.roll;
                        if (t.pitch !== undefined) state.pitch = t.pitch;
                        if (t.emergency_stopped !== undefined) state.eStopActive = t.emergency_stopped;
                        drawLeftPanel();
                        drawCenterPanel();
                        drawBottomPanel();
                        drawHeaderPanel();
                        drawEmergencyBanner();
                    }
                    if (data.type === 'mission_update' && data.mission) applyMissionStatus(data.mission);
                    if (data.type === 'auth_event') {
                        if (data.authorized && data.operator) {
                            playChime(1040, 0.12);
                            const opIdx = state.operators.findIndex(o => o.operator_id === data.operator.operator_id);
                            if (opIdx >= 0) {
                                state.operatorIndex = opIdx;
                                const select = document.getElementById("mission-operator");
                                if (select) select.value = data.operator.operator_id;
                            }
                            state.missionFeedback = data.message || `Flipper Badge Verified: ${data.operator.name}`;
                            updateCommandStatus("READY", state.missionFeedback);
                        } else {
                            playChime(320, 0.2);
                            state.missionFeedback = data.message || `Unauthorized badge: ${data.tag_uid}`;
                            updateCommandStatus("AUTH_REQUIRED", state.missionFeedback);
                        }
                        if (data.mission) applyMissionStatus(data.mission);
                        else syncMissionControls();
                    }
                } catch (e) {}
            };
            ws.onclose = () => {
                state.robotConnected = false;
                drawLeftPanel();
                drawHeaderPanel();
                setTimeout(initWebSocket, 2000);
            };
        }
        initWebSocket();

        // --- Main Render Loop ---
        const clock = new THREE.Clock();
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let lastVideoDrawTime = 0;

        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            planetGroup.rotation.y += delta * 0.05;
            starField.rotation.y -= delta * 0.005;

            // Drive from the in-world virtual joystick while its control is held.
            updateVirtualJoystickControls();

            // Drive from physical VR controller thumbsticks (Meta Quest Touch / Touch Plus)
            updateXrControllerThumbsticks();

            // Refresh video texture at ~25 FPS
            const now = performance.now();
            if (now - lastVideoDrawTime >= 40) {
                drawCenterPanel();
                lastVideoDrawTime = now;
            }

            // Simple FPS counter calculation
            frameCount++;
            if (now - lastFpsTime >= 1000) {
                state.fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
                frameCount = 0;
                lastFpsTime = now;
                drawHeaderPanel();
            }

            renderer.render(scene, camera);
        });

        // --- Window Resize Handling ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
