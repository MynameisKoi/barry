<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BARRY // 3D Holographic VR Cockpit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050814;
            color: #d9e6f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #desktop-ui {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
            pointer-events: none;
        }
        .hud-badge {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
        }
        #switch-flatscreen {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        #switch-flatscreen:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00f0ff;
        }
        #keyboard-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            background: rgba(10, 16, 26, 0.8);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }
    </style>
    <!-- Three.js + WebXR VRButton (Self-Hosted for Offline/Hotspot Reliability) -->
    <script src="/static/js/three.min.js"></script>
    <script src="/static/js/VRButton.js"></script>
</head>
<body>
    <img id="vr-cam-feed" src="/api/camera/stream" crossOrigin="anonymous" style="display:none;" />
    <canvas id="webgl-canvas"></canvas>
    <div id="desktop-ui">
        <div class="hud-badge">BARRY // 3D HOLOGRAPHIC COCKPIT</div>
        <a id="switch-flatscreen" href="/cockpit">← 2D Flatscreen Mode</a>
    </div>
    <div id="keyboard-hint">
        🎮 <b>Controls:</b> WASD / Arrows to Drive · Space for E-Stop · Click / Drag to Look
    </div>

    <script>
        // --- State Management ---
        const state = {
            robotConnected: false,
            robotMode: "remote",
            battery: 0,
            roll: 0.0,
            pitch: 0.0,
            yaw: 0.0,
            rttMs: 12,
            fps: 20,
            frameAgeMs: 45,
            intensity: "MEDIUM",
            lastCommand: "stop",
            forward: 0.0,
            strafe: 0.0,
            turn: 0.0,
            emergencyStopped: false
        };

        // --- Three.js Setup ---
        const canvas = document.getElementById("webgl-canvas");
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050814);
        scene.fog = new THREE.FogExp2(0x050814, 0.015);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.4, 0); // Eye level standing inside cockpit

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.xr.enabled = true;
        renderer.xr.setReferenceSpaceType('local-floor');

        // Add WebXR button to enter immersive VR on Quest 3S
        const vrButton = VRButton.createButton(renderer);
        vrButton.style.zIndex = "100";
        vrButton.style.bottom = "20px";
        vrButton.style.right = "20px";
        document.body.appendChild(vrButton);

        // Ambient & Directional Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xa5b4fc, 0.6);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        // --- Environment: Starfield ---
        const starsCount = 2500;
        const starGeo = new THREE.BufferGeometry();
        const starCoords = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starCoords[i] = (Math.random() - 0.5) * 400;
            starCoords[i + 1] = Math.random() * 200; // Sky dome
            starCoords[i + 2] = (Math.random() - 0.5) * 400;
        }
        starGeo.setAttribute("position", new THREE.BufferAttribute(starCoords, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.85 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // --- Environment: Stylized Purple Saturn Planet with Rings ---
        const planetGroup = new THREE.Group();
        planetGroup.position.set(22, 14, -45); // Upper right sky as in teammate screenshot
        const planetGeo = new THREE.SphereGeometry(6, 32, 32);
        const planetMat = new THREE.MeshLambertMaterial({
            color: 0x6d28d9, // Vibrant purple
            emissive: 0x3b0764,
            emissiveIntensity: 0.4
        });
        const planetMesh = new THREE.Mesh(planetGeo, planetMat);
        planetGroup.add(planetMesh);

        // Saturn Rings
        const ringGeo = new THREE.RingGeometry(7.8, 12.5, 64);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0xc4b5fd,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.75
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2.5;
        ringMesh.rotation.y = Math.PI / 6;
        planetGroup.add(ringMesh);
        scene.add(planetGroup);

        // --- Environment: Retro Cyan Perspective Grid Floor ---
        const gridHelper = new THREE.GridHelper(160, 80, 0x00f0ff, 0x1e3a5f);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // Subtle dark plane under grid to block stars beneath floor
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x050814 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.position.y = -0.02;
        scene.add(floorMesh);
        // Holographic Cockpit Canopy Ribs (Framing the pilot space)
        const ribMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.28 });
        [-1, 1].forEach(side => {
            const curve = new THREE.EllipseCurve(side * 1.6, 1.4, 1.3, 1.5, 0, Math.PI, false, 0);
            const pts = curve.getPoints(40);
            const ribGeo = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p.x, p.y, -2.15)));
            scene.add(new THREE.Line(ribGeo, ribMat));
        });

        // --- Interactive Holographic Panels ---
        function createHoloPanel(w, h, canvasWidth, canvasHeight, pos, rotY = 0, rotX = 0) {
            const offscreenCanvas = document.createElement("canvas");
            offscreenCanvas.width = canvasWidth;
            offscreenCanvas.height = canvasHeight;
            const ctx = offscreenCanvas.getContext("2d");

            const texture = new THREE.CanvasTexture(offscreenCanvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            const geo = new THREE.PlaneGeometry(w, h);
            const mat = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            mesh.rotation.y = rotY;
            if (rotX !== 0) mesh.rotation.x = rotX;
            scene.add(mesh);

            return { canvas: offscreenCanvas, ctx, texture, mesh };
        }

        // 1. LEFT PANEL: STATUS, TELEMETRY & COMMAND SENT (Spread out to left)
        const leftPanel = createHoloPanel(
            1.35, 1.6, 540, 640,
            new THREE.Vector3(-1.85, 1.40, -1.95),
            Math.PI * 0.23, 0 // Angled ~41.4° inward
        );

        function drawLeftPanel() {
            const { ctx, canvas: c, texture } = leftPanel;
            ctx.clearRect(0, 0, c.width, c.height);

            // Translucent rounded panel with glowing border
            ctx.fillStyle = "rgba(10, 16, 28, 0.88)";
            ctx.strokeStyle = "rgba(220, 230, 255, 0.9)";
            ctx.lineWidth = 3;
            roundRect(ctx, 4, 4, c.width - 8, c.height - 8, 16, true, true);

            // STATUS Header
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px -apple-system, monospace";
            ctx.fillText("STATUS", 32, 48);

            // Status Metrics Grid
            ctx.fillStyle = "#94a3b8";
            ctx.font = "18px -apple-system, monospace";
            ctx.fillText("Robot", 32, 90);
            ctx.fillText("Control", 280, 90);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText(state.robotConnected ? "ONLINE" : "--", 32, 118);
            ctx.fillText(state.robotMode.toUpperCase(), 280, 118);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "18px -apple-system, monospace";
            ctx.fillText("Camera", 32, 160);
            ctx.fillText("Backend RTT", 280, 160);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText(state.robotConnected ? "READY" : "--", 32, 188);
            ctx.fillText(`${state.rttMs} ms`, 280, 188);
            // Battery
            ctx.fillStyle = "#94a3b8";
            ctx.font = "18px -apple-system, monospace";
            ctx.fillText("Battery", 32, 230);
            ctx.fillStyle = state.battery > 20 ? "#00ff88" : "#ff2a4b";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText(state.battery > 0 ? `${Math.round(state.battery)} %` : "-- %", 460, 230);

            // Battery bar
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            roundRect(ctx, 32, 246, c.width - 64, 10, 5, true, false);
            if (state.battery > 0) {
                ctx.fillStyle = state.battery > 20 ? "#00ff88" : "#ff2a4b";
                roundRect(ctx, 32, 246, Math.max(10, ((c.width - 64) * state.battery) / 100), 10, 5, true, false);
            }

            // Divider Line
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(32, 290);
            ctx.lineTo(c.width - 32, 290);
            ctx.stroke();

            // COMMAND SENT Header
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 22px -apple-system, monospace";
            ctx.fillText("COMMAND SENT", 32, 335);

            // Command Sliders: Forward, Strafe, Turn
            drawCommandSlider(ctx, 32, 365, "Forward", state.forward);
            drawCommandSlider(ctx, 32, 435, "Strafe", state.strafe);
            drawCommandSlider(ctx, 32, 505, "Turn", state.turn);

            // Footer info dot
            ctx.fillStyle = "#6366f1"; // Purple-blue indicator
            ctx.beginPath();
            ctx.arc(42, 620, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#94a3b8";
            ctx.font = "15px -apple-system, monospace";
            ctx.fillText("Accepted by API · not proof of movement", 58, 625);

            texture.needsUpdate = true;
        }

        function drawCommandSlider(ctx, x, y, label, val) {
            ctx.fillStyle = "#94a3b8";
            ctx.font = "16px -apple-system, monospace";
            ctx.fillText(label, x, y + 14);

            const barX = x + 120;
            const barW = 280;
            const barY = y + 4;
            ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
            roundRect(ctx, barX, barY, barW, 10, 5, true, false);

            // Slider thumb indicator at center + offset
            const clamped = Math.max(-1, Math.min(1, val));
            const thumbX = barX + (barW / 2) + (clamped * (barW / 2));
            ctx.fillStyle = "#ffffff";
            roundRect(ctx, thumbX - 4, barY - 4, 8, 18, 4, true, false);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px -apple-system, monospace";
            ctx.fillText(val.toFixed(2), barX + barW + 24, y + 14);
        }
        // 2. CENTER PANEL: LIVE ROBOT CAMERA (Forward Optics Display)
        const centerPanel = createHoloPanel(
            2.1, 1.4, 840, 560,
            new THREE.Vector3(0, 1.48, -2.4),
            0, 0 // Center front
        );

        function drawCenterPanel() {
            const { ctx, canvas: c, texture } = centerPanel;
            ctx.clearRect(0, 0, c.width, c.height);

            // Outer Frame with glowing white border
            ctx.fillStyle = "rgba(10, 15, 24, 0.92)";
            ctx.strokeStyle = "rgba(230, 238, 255, 0.95)";
            ctx.lineWidth = 3.5;
            roundRect(ctx, 4, 4, c.width - 8, c.height - 8, 16, true, true);

            // Top Header: BARRY MODE · MANUAL
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px -apple-system, monospace";
            ctx.fillText("BARRY", 28, 42);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "16px -apple-system, monospace";
            ctx.fillText("MODE · MANUAL · more modes later", 120, 42);

            ctx.fillText("·· --", c.width - 80, 42);

            // Inner Video Display Area
            const vidX = 24;
            const vidY = 62;
            const vidW = c.width - 48;
            const vidH = c.height - 86;

            ctx.fillStyle = "#020408";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 1.5;
            roundRect(ctx, vidX, vidY, vidW, vidH, 8, true, true);

            // Live Camera Feed Rendering
            let hasLiveFrame = false;
            const vrCamImg = document.getElementById('vr-cam-feed');
            if (vrCamImg && (vrCamImg.naturalWidth > 0 || vrCamImg.complete)) {
                try {
                    ctx.drawImage(vrCamImg, vidX + 2, vidY + 2, vidW - 4, vidH - 4);
                    hasLiveFrame = true;
                } catch (e) {}
            }

            // Video Top HUD Overlay: fps, frame age, roll, pitch
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px monospace";
            ctx.fillText(`·-· ${state.fps} fps`, vidX + 16, vidY + 28);
            ctx.fillText(`DOGZILLA CAM`, vidX + 130, vidY + 28);

            const attitudeText = `ROLL ${state.roll.toFixed(1)}° · PITCH ${state.pitch.toFixed(1)}°`;
            ctx.fillText(attitudeText, vidX + vidW - 240, vidY + 28);

            // Center Crosshair Reticle
            const cx = vidX + vidW / 2;
            const cy = vidY + vidH / 2 - 10;
            ctx.strokeStyle = "rgba(0, 240, 255, 0.6)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy, 18, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 3, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 240, 255, 0.9)";
            ctx.fill();

            if (!hasLiveFrame) {
                ctx.fillStyle = "#94a3b8";
                ctx.font = "bold 15px monospace";
                ctx.textAlign = "center";
                ctx.fillText("[ DOGZILLA LIVE OPTICS ]", cx, cy + 54);

                ctx.font = "13px -apple-system, monospace";
                ctx.fillText("Relaying 640x480 MJPEG · Port 6500", cx, cy + 78);
                ctx.textAlign = "left";
            }

            texture.needsUpdate = true;
        }
        // 3. BOTTOM PANEL: INTENSITY & EMERGENCY STOP FLIGHT DOCK (Angled forward desk)
        const bottomPanel = createHoloPanel(
            1.6, 0.40, 640, 160,
            new THREE.Vector3(0, 0.58, -1.75),
            0, -Math.PI / 6.5 // Tilted ~27.7° upwards towards pilot
        );

        function drawBottomPanel() {
            const { ctx, canvas: c, texture } = bottomPanel;
            ctx.clearRect(0, 0, c.width, c.height);

            // Translucent rounded bar with glowing border
            ctx.fillStyle = "rgba(10, 16, 28, 0.92)";
            ctx.strokeStyle = "rgba(220, 230, 255, 0.95)";
            ctx.lineWidth = 3;
            roundRect(ctx, 4, 4, c.width - 8, c.height - 8, 20, true, true);

            // INTENSITY Label
            ctx.fillStyle = "#94a3b8";
            ctx.font = "bold 13px -apple-system, monospace";
            ctx.fillText("INTENSITY", 28, 38);

            // Intensity Segmented Buttons: LOW, MEDIUM, HIGH
            drawSegmentBtn(ctx, 24, 52, 68, 52, "LOW", state.intensity === "LOW");
            drawSegmentBtn(ctx, 92, 52, 88, 52, "MEDIUM", state.intensity === "MEDIUM");
            drawSegmentBtn(ctx, 180, 52, 74, 52, "HIGH", state.intensity === "HIGH");

            // BIG RED STOP BUTTON
            const stopX = 270;
            const stopY = 28;
            const stopW = 230;
            const stopH = 84;
            ctx.fillStyle = state.emergencyStopped ? "#991b1b" : "#dc2626"; // Vibrant red
            roundRect(ctx, stopX, stopY, stopW, stopH, 14, true, false);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 26px -apple-system, monospace";
            ctx.textAlign = "center";
            ctx.fillText("STOP", stopX + stopW / 2, stopY + 42);

            ctx.font = "13px -apple-system, monospace";
            ctx.fillText("A button · or laser trigger", stopX + stopW / 2, stopY + 68);

            // EXIT VR BUTTON
            const exitX = 520;
            const exitY = 44;
            const exitW = 100;
            const exitH = 54;
            ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.lineWidth = 1.5;
            roundRect(ctx, exitX, exitY, exitW, exitH, 10, true, true);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 15px -apple-system, monospace";
            ctx.fillText("Exit VR", exitX + exitW / 2, exitY + 33);
            ctx.textAlign = "left"; // Reset

            texture.needsUpdate = true;
        }

        // 4. RIGHT PANEL: ACTIONS, POSTURES & SENSORS (Spread out to right)
        const rightPanel = createHoloPanel(
            1.35, 1.6, 540, 640,
            new THREE.Vector3(1.85, 1.40, -1.95),
            -Math.PI * 0.23, 0 // Angled ~41.4° inward
        );

        function drawRightPanel() {
            const { ctx, canvas: c, texture } = rightPanel;
            ctx.clearRect(0, 0, c.width, c.height);

            // Translucent rounded panel with glowing border
            ctx.fillStyle = "rgba(10, 16, 28, 0.88)";
            ctx.strokeStyle = "rgba(220, 230, 255, 0.9)";
            ctx.lineWidth = 3;
            roundRect(ctx, 4, 4, c.width - 8, c.height - 8, 16, true, true);

            // Header: ACTIONS & POSTURES
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px -apple-system, monospace";
            ctx.fillText("ACTIONS & POSTURES", 32, 48);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px -apple-system, monospace";
            ctx.fillText("DOGZILLA S2 · DIRECT KINEMATICS", 32, 74);

            // Divider Line
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(32, 88);
            ctx.lineTo(c.width - 32, 88);
            ctx.stroke();

            // POSTURES Title
            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 16px -apple-system, monospace";
            ctx.fillText("QUICK POSTURE PRESETS", 32, 118);

            // Posture Tiles: 2 columns x 3 rows
            const postures = [
                { label: "STAND", id: "stand" },
                { label: "SIT", id: "sit" },
                { label: "LIE DOWN", id: "liedown" },
                { label: "BOW", id: "bow" },
                { label: "BALANCE", id: "balance" },
                { label: "WAVE", id: "wave" }
            ];

            const tileW = 224;
            const tileH = 50;
            const startX = 32;
            const startY = 136;
            const gapX = 28;
            const gapY = 14;

            postures.forEach((p, idx) => {
                const col = idx % 2;
                const row = Math.floor(idx / 2);
                const tx = startX + col * (tileW + gapX);
                const ty = startY + row * (tileH + gapY);

                const isActive = (state.lastCommand === p.id);
                ctx.fillStyle = isActive ? "rgba(99, 102, 241, 0.35)" : "rgba(255, 255, 255, 0.08)";
                ctx.strokeStyle = isActive ? "#a5b4fc" : "rgba(255, 255, 255, 0.2)";
                ctx.lineWidth = 1.5;
                roundRect(ctx, tx, ty, tileW, tileH, 10, true, true);

                ctx.fillStyle = isActive ? "#ffffff" : "#d9e6f2";
                ctx.font = "bold 15px -apple-system, monospace";
                ctx.textAlign = "center";
                ctx.fillText(p.label, tx + tileW / 2, ty + 31);
                ctx.textAlign = "left";
            });

            // GAIT & MOTION Title
            const gaitY = startY + 3 * (tileH + gapY) + 20;
            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 16px -apple-system, monospace";
            ctx.fillText("GAIT & LOCOMOTION MODES", 32, gaitY);

            // Gait Buttons: Trot, Crawl
            const gaits = [
                { label: "TROT GAIT (Agile)", id: "trot" },
                { label: "CRAWL GAIT (Stable)", id: "crawl" }
            ];
            gaits.forEach((g, idx) => {
                const tx = startX + idx * (tileW + gapX);
                const ty = gaitY + 16;
                ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
                ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
                ctx.lineWidth = 1.5;
                roundRect(ctx, tx, ty, tileW, tileH, 10, true, true);

                ctx.fillStyle = "#d9e6f2";
                ctx.font = "bold 14px -apple-system, monospace";
                ctx.textAlign = "center";
                ctx.fillText(g.label, tx + tileW / 2, ty + 31);
                ctx.textAlign = "left";
            });

            // AI & VISION Title
            const aiY = gaitY + tileH + 34;
            ctx.fillStyle = "#00f0ff";
            ctx.font = "bold 16px -apple-system, monospace";
            ctx.fillText("INTELLIGENCE & SENSORS", 32, aiY);

            // AI Action Buttons
            const aiActions = [
                { label: "AI VISION SCAN", id: "ai_scan" },
                { label: "ZERO IMU HEADING", id: "zero_imu" }
            ];
            aiActions.forEach((a, idx) => {
                const tx = startX + idx * (tileW + gapX);
                const ty = aiY + 16;
                ctx.fillStyle = "rgba(16, 185, 129, 0.15)";
                ctx.strokeStyle = "rgba(16, 185, 129, 0.4)";
                ctx.lineWidth = 1.5;
                roundRect(ctx, tx, ty, tileW, tileH, 10, true, true);

                ctx.fillStyle = "#34d399";
                ctx.font = "bold 14px -apple-system, monospace";
                ctx.textAlign = "center";
                ctx.fillText(a.label, tx + tileW / 2, ty + 31);
                ctx.textAlign = "left";
            });

            // Footer info
            ctx.fillStyle = "#6366f1";
            ctx.beginPath();
            ctx.arc(42, 608, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px -apple-system, monospace";
            ctx.fillText("Point VR laser or mouse click to command", 58, 613);

            texture.needsUpdate = true;
        }

        // --- Helper: Canvas Rounded Rectangle ---
        function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }

        // Render initial panel graphics
        drawLeftPanel();
        drawCenterPanel();
        drawBottomPanel();
        drawRightPanel();

        // --- Interaction: Raycasting & Click Handling ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        async function handleBottomPanelClick(uvX, uvY) {
            // Intensity Buttons
            if (uvY >= 0.30 && uvY <= 0.75) {
                if (uvX >= 0.03 && uvX <= 0.15) {
                    state.intensity = 'LOW';
                    state.speed = 0.3;
                    playChime(600, 0.05);
                    drawBottomPanel();
                } else if (uvX >= 0.14 && uvX <= 0.29) {
                    state.intensity = 'MEDIUM';
                    state.speed = 0.6;
                    playChime(700, 0.05);
                    drawBottomPanel();
                } else if (uvX >= 0.28 && uvX <= 0.41) {
                    state.intensity = 'HIGH';
                    state.speed = 1.0;
                    playChime(850, 0.05);
                    drawBottomPanel();
                }
            }
            // Stop button
            if (uvX >= 0.42 && uvX <= 0.79 && uvY >= 0.25 && uvY <= 0.85) {
                await triggerEmergencyStop();
            }
            // Exit VR button
            if (uvX >= 0.80 && uvX <= 0.98 && uvY >= 0.30 && uvY <= 0.75) {
                const session = renderer.xr.getSession();
                if (session) session.end();
            }
        }

        async function handleRightPanelClick(uvX, uvY) {
            playChime(850, 0.08);
            let action = null;
            let posturePreset = null;

            if (uvX >= 0.05 && uvX <= 0.48) {
                if (uvY >= 0.70 && uvY <= 0.80) posturePreset = "stand";
                else if (uvY >= 0.60 && uvY <= 0.70) posturePreset = "liedown";
                else if (uvY >= 0.50 && uvY <= 0.60) posturePreset = "balance";
                else if (uvY >= 0.37 && uvY <= 0.47) action = "trot";
                else if (uvY >= 0.21 && uvY <= 0.31) action = "ai_scan";
            } else if (uvX >= 0.52 && uvX <= 0.95) {
                if (uvY >= 0.70 && uvY <= 0.80) posturePreset = "sit";
                else if (uvY >= 0.60 && uvY <= 0.70) posturePreset = "bow";
                else if (uvY >= 0.50 && uvY <= 0.60) posturePreset = "wave";
                else if (uvY >= 0.37 && uvY <= 0.47) action = "crawl";
                else if (uvY >= 0.21 && uvY <= 0.31) action = "zero_imu";
            }

            if (posturePreset) {
                state.lastCommand = posturePreset;
                drawRightPanel();
                try {
                    await fetch('/api/robot/command', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: posturePreset })
                    });
                } catch (e) {}
            } else if (action) {
                if (action === "ai_scan") {
                    try { await fetch('/api/v1/missions/scan', { method: 'POST' }); } catch(e) {}
                } else if (action === "zero_imu") {
                    state.roll = 0; state.pitch = 0; drawCenterPanel();
                } else {
                    sendLocomotion(action);
                }
            }
        }

        function dispatchRaycastInteraction(ray) {
            const interactiveMeshes = [bottomPanel.mesh, rightPanel.mesh];
            const hits = ray.intersectObjects(interactiveMeshes);
            if (hits.length > 0) {
                const hit = hits[0];
                const uv = hit.uv;
                if (hit.object === bottomPanel.mesh) {
                    handleBottomPanelClick(uv.x, uv.y);
                } else if (hit.object === rightPanel.mesh) {
                    handleRightPanelClick(uv.x, uv.y);
                }
            }
        }

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            dispatchRaycastInteraction(raycaster);
        });

        // VR Controller Support with Visual Laser Pointers
        function buildLaserPointer() {
            const geo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -3.5)
            ]);
            const mat = new THREE.LineBasicMaterial({
                color: 0x00f0ff,
                transparent: true,
                opacity: 0.55
            });
            return new THREE.Line(geo, mat);
        }

        const controller1 = renderer.xr.getController(0);
        controller1.add(buildLaserPointer());
        scene.add(controller1);

        const controller2 = renderer.xr.getController(1);
        controller2.add(buildLaserPointer());
        scene.add(controller2);

        function handleControllerSelect(controller) {
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            dispatchRaycastInteraction(raycaster);
        }

        controller1.addEventListener('selectstart', () => handleControllerSelect(controller1));
        controller2.addEventListener('selectstart', () => handleControllerSelect(controller2));

        // Desktop 360 Drag Look Controls
        let isDragging = false;
        let prevMouseX = 0;
        let prevMouseY = 0;
        let camYaw = 0;
        let camPitch = 0;

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
                isDragging = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging && !renderer.xr.isPresenting) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                camYaw -= dx * 0.003;
                camPitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, camPitch - dy * 0.003));
                camera.rotation.set(camPitch, camYaw, 0, 'YXZ');
            }
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // --- Web Audio & Sound Feedback ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playChime(freq = 600, duration = 0.08) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // --- High-Performance Non-Blocking Robot Command Dispatcher ---
        let teleopWs = null;
        let isDispatching = false;
        let pendingCommand = null;
        let lastSentAction = 'stop';

        async function sendLocomotion(action, speed = state.speed) {
            if (action === 'stop' && lastSentAction === 'stop' && !pendingCommand) return;
            pendingCommand = { action, speed };
            if (isDispatching) return;

            isDispatching = true;
            try {
                while (pendingCommand) {
                    const cmd = pendingCommand;
                    pendingCommand = null;
                    lastSentAction = cmd.action;

                    if (teleopWs && teleopWs.readyState === WebSocket.OPEN) {
                        teleopWs.send(JSON.stringify({
                            type: 'robot_command',
                            action: cmd.action,
                            speed: cmd.speed
                        }));
                        await new Promise(r => setTimeout(r, 60));
                    } else {
                        await fetch('/api/robot/command', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: cmd.action, speed: cmd.speed })
                        });
                    }
                }
            } catch (e) {
                console.error("Locomotion dispatch failed", e);
            } finally {
                isDispatching = false;
            }
        }

        async function triggerEmergencyStop() {
            playChime(300, 0.25);
            state.eStopActive = !state.eStopActive;
            drawBottomPanel();
            try {
                if (state.eStopActive) {
                    if (teleopWs && teleopWs.readyState === WebSocket.OPEN) {
                        teleopWs.send(JSON.stringify({ type: 'emergency_stop' }));
                    } else {
                        await fetch('/api/robot/command', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'emergency_stop', speed: 0.0 })
                        });
                    }
                } else {
                    await fetch('/api/robot/reset-emergency', { method: 'POST' });
                }
            } catch (e) {
                console.error("Emergency stop toggle failed", e);
            }
        }

        // --- Keyboard Controls (WASD / Arrows / Space) ---
        const activeKeys = new Set();
        let keyTeleopInterval = null;

        function updateKeyMovement() {
            let fwd = 0.0;
            let strafe = 0.0;
            let turn = 0.0;
            let action = 'stop';

            if (activeKeys.has('w') || activeKeys.has('arrowup')) { fwd += 1.0; action = 'forward'; }
            if (activeKeys.has('s') || activeKeys.has('arrowdown')) { fwd -= 1.0; action = 'backward'; }
            if (activeKeys.has('a')) { strafe -= 1.0; action = 'strafe_left'; }
            if (activeKeys.has('d')) { strafe += 1.0; action = 'strafe_right'; }
            if (activeKeys.has('arrowleft') || activeKeys.has('q')) { turn += 1.0; action = 'turn_left'; }
            if (activeKeys.has('arrowright') || activeKeys.has('e')) { turn -= 1.0; action = 'turn_right'; }

            state.cmdFwd = fwd;
            state.cmdStrafe = strafe;
            state.cmdTurn = turn;
            drawLeftPanel();

            if (fwd !== 0 || strafe !== 0 || turn !== 0) {
                playChime(750, 0.04);
                sendLocomotion(action, state.speed);
            } else {
                sendLocomotion('stop', 0.0);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const key = e.key.toLowerCase();
            if (key === ' ') {
                triggerEmergencyStop();
                return;
            }
            if (['w', 's', 'a', 'd', 'q', 'e', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
                activeKeys.add(key);
                updateKeyMovement();
                if (!keyTeleopInterval) {
                    keyTeleopInterval = setInterval(updateKeyMovement, 120);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (activeKeys.has(key)) {
                activeKeys.delete(key);
                updateKeyMovement();
                if (activeKeys.size === 0 && keyTeleopInterval) {
                    clearInterval(keyTeleopInterval);
                    keyTeleopInterval = null;
                }
            }
        });

        // --- WebSocket Telemetry Loop ---
        function initWebSocket() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.onopen = () => {
                state.connected = true;
                teleopWs = ws;
                drawLeftPanel();
                drawCenterPanel();
            };
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'telemetry' && data.telemetry) {
                        const t = data.telemetry;
                        if (t.battery_pct !== undefined) state.battery = t.battery_pct;
                        if (t.roll !== undefined) state.roll = t.roll;
                        if (t.pitch !== undefined) state.pitch = t.pitch;
                        if (t.emergency_stopped !== undefined) state.eStopActive = t.emergency_stopped;
                        drawLeftPanel();
                        drawCenterPanel();
                        drawBottomPanel();
                    }
                } catch (e) {}
            };
            ws.onclose = () => {
                state.connected = false;
                drawLeftPanel();
                setTimeout(initWebSocket, 2000);
            };
        }
        initWebSocket();

        // --- WebXR Controller Thumbstick / Joystick Teleop ---
        let lastJoystickSendTime = 0;
        let isJoystickMoving = false;

        function handleXRThumbsticks() {
            const session = renderer.xr.getSession();
            if (!session) return;

            let fwd = 0;
            let strafe = 0;
            let turn = 0;

            for (const source of session.inputSources) {
                if (!source || !source.gamepad) continue;
                const gp = source.gamepad;
                const axes = gp.axes;
                if (!axes || axes.length === 0) continue;

                const joyX = axes.length >= 4 ? axes[2] : (axes[0] || 0);
                const joyY = axes.length >= 4 ? axes[3] : (axes[1] || 0);

                if (source.handedness === 'left' || source.handedness === 'none') {
                    if (Math.abs(joyY) > 0.18) fwd = -joyY;
                    if (Math.abs(joyX) > 0.18) strafe = joyX;
                } else if (source.handedness === 'right') {
                    if (Math.abs(joyX) > 0.18) turn = joyX;
                }
            }

            state.cmdFwd = fwd;
            state.cmdStrafe = strafe;
            state.cmdTurn = turn;

            const now = performance.now();
            if (now - lastJoystickSendTime >= 120) {
                if (Math.abs(fwd) > 0.2) {
                    sendLocomotion(fwd > 0 ? 'forward' : 'backward', Math.abs(fwd) * state.speed);
                    isJoystickMoving = true;
                    lastJoystickSendTime = now;
                    drawLeftPanel();
                } else if (Math.abs(strafe) > 0.2) {
                    sendLocomotion(strafe > 0 ? 'strafe_right' : 'strafe_left', Math.abs(strafe) * state.speed);
                    isJoystickMoving = true;
                    lastJoystickSendTime = now;
                    drawLeftPanel();
                } else if (Math.abs(turn) > 0.2) {
                    sendLocomotion(turn > 0 ? 'turn_right' : 'turn_left', Math.abs(turn) * state.speed);
                    isJoystickMoving = true;
                    lastJoystickSendTime = now;
                    drawLeftPanel();
                } else if (isJoystickMoving) {
                    sendLocomotion('stop', 0.0);
                    isJoystickMoving = false;
                    lastJoystickSendTime = now;
                    drawLeftPanel();
                }
            }
        }

        // --- Main Render Loop ---
        const clock = new THREE.Clock();
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let lastVideoDrawTime = 0;

        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            planetGroup.rotation.y += delta * 0.05;
            starField.rotation.y -= delta * 0.005;

            // Handle Quest controller thumbstick teleop in VR
            handleXRThumbsticks();

            // Refresh video texture at ~25 FPS
            const now = performance.now();
            if (now - lastVideoDrawTime >= 40) {
                drawCenterPanel();
                lastVideoDrawTime = now;
            }

            // Simple FPS counter calculation
            frameCount++;
            if (now - lastFpsTime >= 1000) {
                state.fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
                frameCount = 0;
                lastFpsTime = now;
            }

            renderer.render(scene, camera);
        });

        // --- Window Resize Handling ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
